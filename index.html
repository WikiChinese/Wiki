function wireDraftForm(container, draft){
  draft = draft || draftUnit;
  container.querySelectorAll('[data-bind]').forEach(el=>{
    const sync = ()=> setPath(draft, el.dataset.bind, el.type==='checkbox' ? el.checked : el.value);
    el.addEventListener(el.type==='checkbox' ? 'change' : 'input', sync);
    if(el.type!=='checkbox') el.addEventListener('change', sync);
  });
  container.querySelectorAll('[data-image-bind]').forEach(el=>{
    el.addEventListener('change', ()=>{
      handleImageUpload(el, (dataUrl)=>{ setPath(draft, el.dataset.imageBind, dataUrl); renderMain(); });
    });
  });
  container.querySelectorAll('[data-image-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{ setPath(draft, el.dataset.imageRemove, ''); renderMain(); });
  });
  container.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=> handleDraftAction(el.dataset, draft));
  });
}

function handleDraftAction(ds, draft){
  draft = draft || draftUnit;
  const action = ds.action;
  const ai = ds.attackIndex !== undefined ? parseInt(ds.attackIndex) : null;
  const idx = ds.index !== undefined ? parseInt(ds.index) : null;
  const mi = ds.mediaIndex !== undefined ? parseInt(ds.mediaIndex) : null;
  if(action==='addSkill') draft.skills.push({id:uid(), name:'新技能', media:[], description:'', targetType:'', cost:''});
  else if(action==='removeSkill') draft.skills.splice(idx,1);
  else if(action==='addCharacterCard') draft.characterCards.push({id:uid(), name:'新角色卡', image:'', description:'', rarity:'', unitId:''});
  else if(action==='removeCharacterCard') draft.characterCards.splice(idx,1);
  else if(action==='addBasicCard') draft.basicCards.push({id:uid(), name:'新基础卡', image:'', description:'', rarity:''});
  else if(action==='removeBasicCard') draft.basicCards.splice(idx,1);
  else if(action==='addFloor') draft.floors.push({id:uid(), name:'第 '+(draft.floors.length+1)+' 层', image:'', description:''});
  else if(action==='removeFloor') draft.floors.splice(idx,1);
  else if(action==='addStageLevel') draft.levels.push({id:uid(), name:'第 '+(draft.levels.length+1)+' 关', image:'', description:'', shop:[]});
  else if(action==='removeStageLevel') draft.levels.splice(idx,1);
  else if(action==='addShopItem'){ if(!Array.isArray(draft.shop)) draft.shop=[]; draft.shop.push({id:uid(), refType:'', refId:'', quantity:'', price:''}); }
  else if(action==='removeShopItem') draft.shop.splice(idx,1);
  else if(action==='addUpgradeLevel') draft.levels.push({id:uid(), name:'升级 '+(draft.levels.length+1), image:'', description:''});
  else if(action==='removeUpgradeLevel') draft.levels.splice(idx,1);
  else if(action==='toggleOdysseyUnit'){
    const id = ds.unitId;
    if(!Array.isArray(draft.unitIds)) draft.unitIds = [];
    const i = draft.unitIds.indexOf(id);
    if(i>=0) draft.unitIds.splice(i,1); else draft.unitIds.push(id);
  }
  else if(action==='addSkillMedia'){ if(!Array.isArray(draft.skills[idx].media)) draft.skills[idx].media=[]; draft.skills[idx].media.push(''); }
  else if(action==='removeSkillMedia'){ draft.skills[idx].media.splice(mi,1); }
  else if(action==='addAttackMedia'){ if(!Array.isArray(draft.attacks[ai].media)) draft.attacks[ai].media=[]; draft.attacks[ai].media.push(''); }
  else if(action==='removeAttackMedia'){ draft.attacks[ai].media.splice(mi,1); }
  else if(action==='addSkinMedia'){ if(!Array.isArray(draft.skins[idx].media)) draft.skins[idx].media=[]; draft.skins[idx].media.push(''); }
  else if(action==='removeSkinMedia'){ draft.skins[idx].media.splice(mi,1); }
  else if(action==='addOtherForm') draft.otherForms.push({id:uid(), name:'新形态', image:'', trigger:'', passives:[]});
  else if(action==='removeOtherForm') draft.otherForms.splice(idx,1);
  else if(action==='addAttack'){ const n=draft.attacks.length+1; draft.attacks.push({id:uid(), name:'攻击'+n, image:'', media:[], damage:'', range:'', levels:[{label:'LV0',spa:'',cost:''}]}); }
  else if(action==='removeAttack') draft.attacks.splice(idx,1);
  else if(action==='addLevel'){ const atk=draft.attacks[ai]; atk.levels.push({label:'LV'+atk.levels.length, spa:'',cost:''}); }
  else if(action==='bulkAddLevels'){
    const atk = draft.attacks[ai];
    if(atk.levels.length >= 11){ showToast('已经有LV0-LV10了'); }
    while(atk.levels.length < 11){
      atk.levels.push({label:'LV'+atk.levels.length, spa:'', cost:''});
    }
  }
  else if(action==='removeLevel') draft.attacks[ai].levels.splice(idx,1);
  else if(action==='addSkin') draft.skins.push({id:uid(), name:'新皮肤', image:'', media:[], description:'', rarity:'', series:'', obtainWay:'', referenceUrl:''});
  else if(action==='removeSkin') draft.skins.splice(idx,1);
  else if(action==='addPassive'){
    const path = ds.path;
    const list = getPath(draft, path);
    list.push({id:uid(), name:'被动'+(list.length+1), description:'', scope:'universal'});
  }
  else if(action==='removePassive'){
    const path = ds.path;
    const list = getPath(draft, path);
    list.splice(idx,1);
  }
  else if(action==='toggleExclusiveTarget'){
    const field = ds.field;
    const val = ds.target;
    let arr = getPath(draft, field);
    if(!Array.isArray(arr)) arr = arr ? [arr] : [];
    const i = arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else arr.push(val);
    setPath(draft, field, arr);
  }
  else if(action==='toggleMark'){
    const markId = ds.markId;
    if(!Array.isArray(draft.marks)) draft.marks = [];
    const i = draft.marks.indexOf(markId);
    if(i>=0) draft.marks.splice(i,1); else draft.marks.push(markId);
  }
  else if(action==='toggleLevelMechanic'){
    const mechId = ds.mechanicId;
    if(!Array.isArray(draft.mechanics)) draft.mechanics = [];
    const i = draft.mechanics.indexOf(mechId);
    if(i>=0) draft.mechanics.splice(i,1); else draft.mechanics.push(mechId);
  }
  else if(action==='selectGroup'){
    const gid = ds.groupId;
    if(!Array.isArray(draft.groups)) draft.groups = [];
    const gi = draft.groups.indexOf(gid);
    if(gi>=0) draft.groups.splice(gi,1); else draft.groups.push(gid);
  }
  else if(action==='selectElement'){
    const eid = ds.elementId;
    if(!Array.isArray(draft.elements)) draft.elements = [];
    const ei = draft.elements.indexOf(eid);
    if(ei>=0) draft.elements.splice(ei,1); else draft.elements.push(eid);
  }
  else if(action==='addUnitMemory'){
    const id = ds.memoryId;
    if(!Array.isArray(draft.linkedMemories)) draft.linkedMemories = [];
    if(!draft.linkedMemories.includes(id)) draft.linkedMemories.push(id);
  }
  else if(action==='removeUnitMemory'){
    const id = ds.memoryId;
    draft.linkedMemories = (draft.linkedMemories||[]).filter(x=>x!==id);
  }
  else if(action==='addUnitFamily'){
    const id = ds.familyId;
    if(!Array.isArray(draft.linkedFamilies)) draft.linkedFamilies = [];
    if(!draft.linkedFamilies.includes(id)) draft.linkedFamilies.push(id);
  }
  else if(action==='removeUnitFamily'){
    const id = ds.familyId;
    draft.linkedFamilies = (draft.linkedFamilies||[]).filter(x=>x!==id);
  }
  else if(action==='addRelatedUnit'){
    const id = ds.unitId;
    if(!Array.isArray(draft.relatedUnits)) draft.relatedUnits = [];
    if(!draft.relatedUnits.some(r=>r.unitId===id)) draft.relatedUnits.push({id:uid(), unitId:id, note:''});
  }
  else if(action==='removeRelatedUnit'){
    draft.relatedUnits.splice(idx,1);
  }
  else if(action==='toggleMemoryFamily'){
    const id = ds.familyId;
    if(!Array.isArray(draft.linkedFamilies)) draft.linkedFamilies = [];
    const i = draft.linkedFamilies.indexOf(id);
    if(i>=0) draft.linkedFamilies.splice(i,1); else draft.linkedFamilies.push(id);
  }
  else if(action==='toggleLogUnit'){
    const id = ds.unitId;
    if(!Array.isArray(draft.linkedUnits)) draft.linkedUnits = [];
    const i = draft.linkedUnits.indexOf(id);
    if(i>=0) draft.linkedUnits.splice(i,1); else draft.linkedUnits.push(id);
  }
  else if(action==='toggleLogMemory'){
    const id = ds.memoryId;
    if(!Array.isArray(draft.linkedMemories)) draft.linkedMemories = [];
    const i = draft.linkedMemories.indexOf(id);
    if(i>=0) draft.linkedMemories.splice(i,1); else draft.linkedMemories.push(id);
  }
  else if(action==='toggleLogFamily'){
    const id = ds.familyId;
    if(!Array.isArray(draft.linkedFamilies)) draft.linkedFamilies = [];
    const i = draft.linkedFamilies.indexOf(id);
    if(i>=0) draft.linkedFamilies.splice(i,1); else draft.linkedFamilies.push(id);
  }
  else if(action==='insertMarkToken'){
    const field = ds.field;
    const markName = ds.markName;
    const val = window.prompt(`为「${markName}」输入数值（可留空，只显示标记名称，不带数值）`, '');
    if(val === null) return;
    const trimmed = val.trim();
    const token = trimmed ? `[[${markName}|${trimmed}]]` : `[[${markName}]]`;
    const current = getPath(draft, field) || '';
    const textarea = document.querySelector(`[data-bind="${field}"]`);
    const selStart = (textarea && typeof textarea.selectionStart === 'number') ? textarea.selectionStart : current.length;
    const selEnd = (textarea && typeof textarea.selectionEnd === 'number') ? textarea.selectionEnd : selStart;
    const before = current.slice(0, selStart);
    const after = current.slice(selEnd);
    const spaceBefore = before && !/\s$/.test(before) ? ' ' : '';
    const spaceAfter = after && !/^\s/.test(after) ? ' ' : '';
    setPath(draft, field, before + spaceBefore + token + spaceAfter + after);
  }
  renderMain();
}

function markToggleHtml(mark, isActive){
  const icon = mark.image ? `<img src="${mark.image}">` : '';
  return `<button type="button" class="mark-toggle ${isActive?'active':''}" style="${toggleChipStyle(mark.color, isActive)}" data-action="toggleMark" data-mark-id="${mark.id}" title="${escapeHtml(mark.description||mark.name)}">${icon}${escapeHtml(mark.name)}</button>`;
}

function enemyMechanicToggleHtml(mech, isActive){
  const icon = mech.image ? `<img src="${mech.image}">` : '';
  return `<button type="button" class="mark-toggle ${isActive?'active':''}" style="${toggleChipStyle(mech.color, isActive)}" data-action="toggleLevelMechanic" data-mechanic-id="${mech.id}" title="${escapeHtml(mech.description||mech.name)}">${icon}${escapeHtml(mech.name)}</button>`;
}

function groupToggleHtml(group, isActive){
  const icon = group.image ? `<img src="${group.image}">` : '';
  return `<button type="button" class="mark-toggle ${isActive?'active':''}" style="${toggleChipStyle(group.color, isActive)}" data-action="selectGroup" data-group-id="${group.id}">${icon}${escapeHtml(group.name)}</button>`;
}

function elementToggleHtml(element, isActive){
  const icon = element.image ? `<img src="${element.image}">` : '';
  return `<button type="button" class="mark-toggle ${isActive?'active':''}" style="${toggleChipStyle(element.color, isActive)}" data-action="selectElement" data-element-id="${element.id}">${icon}${escapeHtml(element.name)}</button>`;
}

function memoryCardPreviewHtml(memoryId){
  const m = state.memories.find(x=>x.id===memoryId);
  if(!m) return '';
  const icon = m.image ? (isVideoUrl(m.image) ? `<video class="image-preview small" style="width:56px;height:56px;" src="${m.image}" autoplay loop muted playsinline></video>` : `<img class="image-preview small" style="width:56px;height:56px;" src="${m.image}">`) : '';
  const desc = (m.passives||[]).map(p=>`<strong>${escapeHtml(p.name)}：</strong>${escapeHtml(p.description||'')}`).join('<br>');
  return `<div class="sub-card" style="display:flex;gap:12px;align-items:flex-start;">
    ${icon}
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;color:var(--gold);margin-bottom:4px;">${escapeHtml(m.name)}</div>
      <div style="font-size:13px;color:var(--text-dim);line-height:1.6;">${desc || '<span style="color:var(--text-faint);">暂无被动说明</span>'}</div>
    </div>
    <button class="btn btn-danger" type="button" data-action="removeUnitMemory" data-memory-id="${m.id}">移除</button>
  </div>`;
}

function familyCardPreviewHtml(familyId){
  const f = state.families.find(x=>x.id===familyId);
  if(!f) return '';
  const icon = f.image ? (isVideoUrl(f.image) ? `<video class="image-preview small" style="width:56px;height:56px;" src="${f.image}" autoplay loop muted playsinline></video>` : `<img class="image-preview small" style="width:56px;height:56px;" src="${f.image}">`) : '';
  const desc = (f.passives||[]).map(p=>`<strong>${escapeHtml(p.name)}：</strong>${escapeHtml(p.description||'')}`).join('<br>');

function familyToggleHtml(family, isActive){

  return `<button type="button" class="mark-toggle ${isActive?'active':''}" style="${toggleChipStyle('#4a8fd1', isActive)}" data-action="toggleMemoryFamily" data-family-id="${family.id}">${icon}${escapeHtml(family.name)}</button>`;

function markInsertButtonsHtml(fieldPath){
  const markBtns = state.marks.map(m=>{
    const icon = m.image ? `<img src="${m.image}">` : `<span class="mark-dot" style="background:${m.color||'var(--gold)'}"></span>`;
    return `<button type="button" class="entity-picker-item" data-action="insertMarkToken" data-field="${fieldPath}" data-mark-name="${escapeHtml(m.name)}">${icon}${escapeHtml(m.name)}</button>`;
  }).join('');
  const elementBtns = state.elements.map(el2=>{
    const icon = el2.image ? `<img src="${el2.image}">` : `<span class="mark-dot" style="background:${el2.color||'var(--gold)'}"></span>`;
    return `<button type="button" class="entity-picker-item" data-action="insertMarkToken" data-field="${fieldPath}" data-mark-name="${escapeHtml(el2.name)}">${icon}${escapeHtml(el2.name)}</button>`;
  }).join('');
  const groupBtns = state.groups.map(g=>{
    const icon = g.image ? `<img src="${g.image}">` : `<span class="mark-dot" style="background:${g.color||'var(--gold)'}"></span>`;
    return `<button type="button" class="entity-picker-item" data-action="insertMarkToken" data-field="${fieldPath}" data-mark-name="${escapeHtml(g.name)}">${icon}${escapeHtml(g.name)}</button>`;
  }).join('');
  const mechanicBtns = state.enemyMechanics.map(mc=>{
    const icon = mc.image ? `<img src="${mc.image}">` : `<span class="mark-dot" style="background:${mc.color||'var(--gold)'}"></span>`;
    return `<button type="button" class="entity-picker-item" data-action="insertMarkToken" data-field="${fieldPath}" data-mark-name="${escapeHtml(mc.name)}">${icon}${escapeHtml(mc.name)}</button>`;
  }).join('');
  const dotRow = (label, key, dotColor, emoji, btns) => `<details class="insert-dot-picker" data-picker-key="${key}"${openPickerKeys.has(key)?' open':''}>
    <summary class="insert-dot" style="background:${dotColor};" title="插入${label}">${emoji}</summary>
    <div class="entity-picker-list insert-dot-panel">${btns}</div>
  </details>`;
  let html = '<div class="insert-dot-row">';
  let any = false;
  if(state.marks.length){ html += dotRow('状态标记', 'insert-marks-'+fieldPath, 'var(--gold)', '🔥', markBtns); any = true; }
  if(state.elements.length){ html += dotRow('元素图标', 'insert-elements-'+fieldPath, 'var(--teal)', '🌪️', elementBtns); any = true; }
  if(state.groups.length){ html += dotRow('分组图标', 'insert-groups-'+fieldPath, '#4a8b7c', '👥', groupBtns); any = true; }
  if(state.enemyMechanics.length){ html += dotRow('敌方机制', 'insert-mechanics-'+fieldPath, '#b8544a', '☠️', mechanicBtns); any = true; }
  html += '</div>';
  if(!any){ html = '<div class="hint">还没有可用的状态标记、元素、分组或敌方机制，先去左侧对应页面新增。</div>'; }
  return html;
}

      btn.addEventListener('click', ()=>{

        render();
      });
    });
    wirePickerToggles(container);
    document.getElementById('cancelBtn').addEventListener('click', ()=>{ editMode=false; render(); });
    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      item.name = document.getElementById('editName').value.trim() || '未命名物品';
      item.englishName = document.getElementById('editEnglishName').value.trim();
      item.image = pendingImage;
      item.rarity = document.getElementById('editRarity').value || null;

      currentView = {type:'home'};
      editMode = false;
      await saveData(false);
      render();

  }

  container.innerHTML = `
    <div class="page-toolbar">
      <div class="crumb">物品</div>
      <div class="toolbar-actions">${backButtonHtml()}${isAdmin ? '<button class="btn" id="editBtn">编辑</button>' : '<span class="view-only-note" style="margin:0;padding:6px 12px;">仅查看</span>'}</div>
    </div>
    ${item.image ? `<img class="unit-image zoomable" src="${item.image}">` : ''}
    <div class="page-header">
      <h1 class="page-title">${escapeHtml(item.name)}</h1>
      ${item.englishName ? `<div class="unit-english-name">${escapeHtml(item.englishName)}</div>` : ''}
      <div class="meta-row">${rarityBadge(item.rarity)}${itemCategoryObj ? `<span class="mark-chip" style="${coloredChipStyle(itemCategoryObj.color)}">${escapeHtml(itemCategoryObj.name)}</span>` : ''}</div>
    </div>
    <div class="content-body">${renderMarkdownLite(item.description) || '<p style="color:var(--text-faint);">暂无内容</p>'}</div>
    ${item.questline ? `<div class="section-label">任务线</div><div class="content-body">${renderMarkdownLite(item.questline)}</div>` : ''}
    ${evolvesUnit ? `<div class="section-label">完成后用于进化</div><a href="${viewToHash({type:'unit', id:evolvesUnit.id})}" class="shop-item-card" data-view="unit" data-id="${evolvesUnit.id}" style="max-width:220px;">
      <div class="shop-item-icon-wrap">${evolvesUnit.image ? `<img class="shop-item-icon" src="${evolvesUnit.image}">` : `<div class="shop-item-icon-placeholder"></div>`}</div>
      <div class="shop-item-body"><div class="shop-item-name">${escapeHtml(evolvesUnit.name)}</div>${item.evolveQuantity ? `<div class="shop-item-qty">${escapeHtml(item.evolveQuantity)}</div>` : ''}</div>
    </a>` : ''}
  `;
  const evoCard = container.querySelector('.shop-item-card[data-view="unit"]');
  if(evoCard) evoCard.addEventListener('click', (e)=>{
    if(!isPlainLeftClick(e)) return;
    e.preventDefault();
    goToView({type:'unit', id: evoCard.dataset.id});

function renderMain(){
  if(currentView.type==='home') renderHome();
  else if(currentView.type==='tierlist') renderTierlist();
  else if(currentView.type==='statusEffects') renderStatusEffects();
  else if(currentView.type==='odyssey') renderOdyssey();
  else if(currentView.type==='attackTypes') renderAttackTypes();
  else if(currentView.type==='enemyMechanics') renderEnemyMechanics();
  else if(currentView.type==='traits') renderTraitsPage();
  else if(currentView.type==='stage') renderStagePage();
  else if(currentView.type==='stageLevel') renderStageLevelPage();
  else if(currentView.type==='upgrade') renderUpgradePage();
  else if(currentView.type==='settings') renderSettings();
  else if(currentView.type==='unit') renderUnit();
  else if(currentView.type==='item') renderItem();
  else if(currentView.type==='family') renderSimpleEntity('family');
  else if(currentView.type==='memory') renderSimpleEntity('memory');
  else if(currentView.type==='unitGallery') renderGallery('unit');
  else if(currentView.type==='itemGallery') renderGallery('item');
  else if(currentView.type==='familyGallery') renderGallery('family');
  else if(currentView.type==='memoryGallery') renderGallery('memory');
}

function galleryConfig(type){
  const map = {
    unit:{collection:'units', label:'单位', viewType:'unit', addBtnId:'addUnitBtn'},
    item:{collection:'items', label:'物品', viewType:'item', addBtnId:'addItemBtn'},
    family:{collection:'families', label:'使魔', viewType:'family', addBtnId:'addFamilyBtn'},
    memory:{collection:'memories', label:'记忆', viewType:'memory', addBtnId:'addMemoryBtn'}
  };
  return map[type];
}

function renderGallery(type){
  const cfg = galleryConfig(type);
  const container = document.getElementById('mainInner');
  const list = state[cfg.collection];
  const hasRarity = type==='unit' || type==='item' || type==='family' || type==='memory';

  function cardHtml(entity){
    const searchText = escapeHtml(((entity.name||'')+' '+(entity.englishName||'')).toLowerCase());
    return `<a href="${viewToHash({type:cfg.viewType, id:entity.id})}" class="gallery-card" data-view="${cfg.viewType}" data-id="${entity.id}" data-search="${searchText}"${entity.categoryId?` data-item-category="${entity.categoryId}"`:''}${isAdmin ? ' draggable="true"' : ''}>
      <div class="gallery-card-img-wrap">
        ${entity.image ? `<img class="gallery-card-img" src="${entity.image}" alt="${escapeHtml(entity.name)}" onerror="handleGalleryImgError(this)">` : `<div class="gallery-card-placeholder">无图片</div>`}
        ${entity.isLimitedReturn ? `<span class="gallery-card-limited-tag">🔄</span>` : ''}
      </div>
      <div class="gallery-card-name">${escapeHtml(entity.name)}${entity.englishName ? ` <span class="gallery-card-en">${escapeHtml(entity.englishName)}</span>` : ''}</div>
    </a>`;
  }
  const categoryFilterHtml = (type==='item' && list.length && state.itemCategories.length) ? `<div class="gallery-category-filter">
    <button type="button" class="gallery-category-chip active" data-cat-filter="">全部</button>
    ${state.itemCategories.map(c=>`<button type="button" class="gallery-category-chip" data-cat-filter="${c.id}" style="${dimChipStyle(c.color)}">${escapeHtml(c.name)}</button>`).join('')}
  </div>` : '';

  let cardsHtml, statsHtml = '', groups = [], recentHtml = '';
  if(!list.length){
    cardsHtml = `<div class="empty-hint" style="padding-left:0;">暂无${cfg.label}，${isAdmin ? '点右上角新增一个吧' : '敬请期待'}</div>`;
  } else if(hasRarity){
    groups = state.rarities.map(r=>({rarity:r, items:list.filter(e=>e.rarity===r.id)})).filter(g=>g.items.length);
    const unranked = list.filter(e=>!e.rarity || !state.rarities.some(r=>r.id===e.rarity));
    if(unranked.length) groups.push({rarity:null, items:unranked});
    cardsHtml = groups.map(g=>{
      const key = 'gallery-rarity-'+type+'-'+(g.rarity ? g.rarity.id : 'unranked');
      const isOpen = openRaritySections.has(key);
      const peekHtml = g.items.slice(0,6).filter(e=>e.image).map(e=>`<img src="${e.image}">`).join('');
      return `
      <details class="rarity-section" data-rarity-key="${key}"${isOpen?' open':''}>
        <summary class="rarity-section-head">${g.rarity ? rarityBadge(g.rarity.id) : `<span class="badge badge-common" style="background:var(--card);color:var(--text-faint);">未分级</span>`}${peekHtml ? `<span class="rarity-section-peek">${peekHtml}</span>` : ''}<span class="rarity-section-count">${g.items.length}</span><span class="rarity-section-arrow">▸</span></summary>
        <div class="gallery-grid">${g.items.map(cardHtml).join('')}</div>
      </details>`;
    }).join('');
    if(groups.length>1){
      const distBarHtml = `<div class="gallery-distribution-bar">${groups.map(g=>{
        const key = 'gallery-rarity-'+type+'-'+(g.rarity ? g.rarity.id : 'unranked');
        const bg = g.rarity ? (g.rarity.color||'var(--gold-dim)') : 'var(--border-light)';
        const label = g.rarity ? g.rarity.name : '未分级';
        return `<div class="gallery-distribution-seg" style="flex:${g.items.length};background:${bg};" title="${escapeHtml(label)} ${g.items.length}" data-jump="${key}"></div>`;
      }).join('')}</div>`;
      statsHtml = `<div class="gallery-stats-bar">
        <span class="gallery-stats-total">共 ${list.length} 个${cfg.label}</span>
        ${distBarHtml}
        <div class="gallery-stats-chips">${groups.map(g=>{
          const key = 'gallery-rarity-'+type+'-'+(g.rarity ? g.rarity.id : 'unranked');
          const style = g.rarity ? dimChipStyle(g.rarity.color) : 'background:var(--card);color:var(--text-faint);';
          return `<button type="button" class="gallery-stats-chip" style="${style}" data-jump="${key}">${g.rarity ? escapeHtml(g.rarity.name) : '未分级'} <b>${g.items.length}</b></button>`;
        }).join('')}</div>
      </div>`;
    }
    if(list.length>6){
      const recent = [...list].filter(e=>e.updatedAt).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,10);
      if(recent.length){
        recentHtml = `<div class="section-label" style="margin-top:0;">最近更新</div>
        <div class="gallery-recent-strip">${recent.map(e=>`<a href="${viewToHash({type:cfg.viewType, id:e.id})}" class="gallery-recent-card" data-view="${cfg.viewType}" data-id="${e.id}">
          ${e.image ? `<img class="gallery-recent-img" src="${e.image}">` : `<div class="gallery-recent-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-faint);">无图片</div>`}
          <div class="gallery-recent-name">${escapeHtml(e.name)}</div>
        </a>`).join('')}</div>`;
      }
    }
  } else {
    cardsHtml = `<div class="gallery-grid">${list.map(cardHtml).join('')}</div>`;
  }

  container.innerHTML = `
    <div class="page-toolbar">
      <h1 class="page-title" style="margin:0;">${cfg.label}</h1>
      <div class="toolbar-actions">${backButtonHtml()}${isAdmin ? `<button class="btn btn-gold" id="galleryAddBtn">+ 新增${cfg.label}</button>` : ''}</div>
    </div>
    ${list.length>1 ? `<div class="gallery-search-bar"><span class="gallery-search-icon">🔍</span><input type="text" id="gallerySearchInput" class="gallery-search-input" placeholder="搜索${cfg.label}名称..."></div>` : ''}
    ${categoryFilterHtml}
    ${statsHtml}
    ${recentHtml}
    ${isAdmin && list.length>1 ? `<div class="hint" style="margin:-6px 0 14px;">💡 按住卡片拖动，可以调整排列顺序（比如把新的拖到前面）。</div>` : ''}
    ${cardsHtml}
  `;

  const addBtn = document.getElementById('galleryAddBtn');
  if(addBtn) addBtn.addEventListener('click', ()=> document.getElementById(cfg.addBtnId).click());
  wireBackButton(container);

  container.querySelectorAll('details.rarity-section[data-rarity-key]').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      if(d.open) openRaritySections.add(d.dataset.rarityKey);
      else openRaritySections.delete(d.dataset.rarityKey);
    });
  });

  let activeCategoryFilter = '';
  function applyGalleryFilters(){
    const q = (document.getElementById('gallerySearchInput')?.value||'').trim().toLowerCase();
    const sections = container.querySelectorAll('details.rarity-section[data-rarity-key]');
    const matchCard = (card)=>{
      const searchText = card.dataset.search || (card.querySelector('.gallery-card-name')?.textContent||'').toLowerCase();
      const searchOk = !q || searchText.includes(q);
      const catOk = !activeCategoryFilter || card.dataset.itemCategory===activeCategoryFilter;
      return searchOk && catOk;
    };
    if(sections.length){
      sections.forEach(section=>{
        let anyVisible = false;
        section.querySelectorAll('.gallery-card').forEach(card=>{
          const match = matchCard(card);
          card.style.display = match ? '' : 'none';
          if(match) anyVisible = true;
        });
        section.style.display = anyVisible ? '' : 'none';
        section.open = (q || activeCategoryFilter) ? true : openRaritySections.has(section.dataset.rarityKey);
      });
    } else {
      container.querySelectorAll('.gallery-card').forEach(card=>{
        card.style.display = matchCard(card) ? '' : 'none';
      });
    }
  }

  const searchInput = document.getElementById('gallerySearchInput');
  if(searchInput) searchInput.addEventListener('input', applyGalleryFilters);

  container.querySelectorAll('.gallery-category-chip[data-cat-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeCategoryFilter = chip.dataset.catFilter;
      container.querySelectorAll('.gallery-category-chip').forEach(c=>c.classList.toggle('active', c===chip));
      applyGalleryFilters();
    });
  });

  container.querySelectorAll('.gallery-stats-chip[data-jump], .gallery-distribution-seg[data-jump]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const section = container.querySelector(`details.rarity-section[data-rarity-key="${chip.dataset.jump}"]`);
      if(!section) return;
      section.open = true;
      openRaritySections.add(chip.dataset.jump);
      section.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  container.querySelectorAll('.gallery-card, .gallery-recent-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(!isPlainLeftClick(e)) return;
      e.preventDefault();
      goToView({type: card.dataset.view, id: card.dataset.id});
      editMode = false; draftUnit=null; draftSimple=null; showingShinyImage=false;
      render();
    });
  });

  if(isAdmin){
    let dragSrcId = null;
    container.querySelectorAll('.gallery-card').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragSrcId = card.dataset.id;
        card.classList.add('dragging');
        if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', card.dataset.id); }catch(err){} }
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        container.querySelectorAll('.gallery-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
        dragSrcId = null;
      });
      card.addEventListener('dragover', (e)=>{
        if(!dragSrcId || card.dataset.id===dragSrcId) return;
        e.preventDefault();
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', ()=>{
        card.classList.remove('drag-over');
      });
      card.addEventListener('drop', async (e)=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        const targetId = card.dataset.id;
        if(!dragSrcId || dragSrcId===targetId) return;
        const srcIdx = list.findIndex(x=>x.id===dragSrcId);
        if(srcIdx<0) return;
        const [moved] = list.splice(srcIdx,1);
        const tgtIdx = list.findIndex(x=>x.id===targetId);
        list.splice(tgtIdx<0 ? list.length : tgtIdx, 0, moved);
        dragSrcId = null;
        await saveData(true);
        renderGallery(type);
      });
    });
  }
}

function simpleEntityConfig(type){
  return type==='family'
    ? {collection:'families', label:'使魔', notFound:'未找到该使魔', unnamed:'未命名使魔'}
    : {collection:'memories', label:'记忆', notFound:'未找到该记忆', unnamed:'未命名记忆'};
}

function startSimpleEdit(type, entity){
  draftSimple = JSON.parse(JSON.stringify(entity));
  draftSimple._type = type;
  if(!Array.isArray(draftSimple.marks)) draftSimple.marks = [];
  if(!Array.isArray(draftSimple.passives)){
    draftSimple.passives = entity.passive ? [{id:uid(), name:'被动1', description:entity.passive, scope:'universal'}] : [];
  }
  draftSimple.passives.forEach(p=>{ if(!p.scope) p.scope = 'universal'; });
  if(type==='family'){
    draftSimple.exclusiveTarget = Array.isArray(entity.exclusiveTarget) ? entity.exclusiveTarget.slice() : (entity.exclusiveTarget ? [entity.exclusiveTarget] : []);
  }
  if(type==='memory'){
    draftSimple.personalTarget = Array.isArray(entity.personalTarget) ? entity.personalTarget.slice() : (entity.personalTarget ? [entity.personalTarget] : []);
    if(!Array.isArray(draftSimple.linkedFamilies)) draftSimple.linkedFamilies = [];
  }
  draftSimple.rarity = entity.rarity || '';
  draftSimple.obtainWay = entity.obtainWay || '';
  editMode = true;
}

function renderSimpleEntity(type){
  const cfg = simpleEntityConfig(type);
  const container = document.getElementById('mainInner');
  const collection = state[cfg.collection];
  const entity = collection.find(e=>e.id===currentView.id);
  if(!entity){ container.innerHTML = `<div class="empty-state"><h2>${cfg.notFound}</h2></div>`; return; }

  if(editMode){
    if(!draftSimple || draftSimple.id !== entity.id || draftSimple._type !== type) startSimpleEdit(type, entity);

    const restrictFieldHtml = type==='family'
      ? `<div class="edit-field">
          <span class="edit-label">专属被动对象</span>
          ${exclusiveTargetPickerHtml(draftSimple.exclusiveTarget, 'exclusiveTarget')}
          <div class="hint">可以选择一个或多个单位/元素。选择后表示这个使魔被动只有对应的单位（或该元素的所有单位）可以使用，例如"专属被动对象：Unbound"。不选表示不限制。</div>
        </div>
        <div class="edit-field">
          <span class="edit-label">稀有度</span>
          <select class="edit-select" data-bind="rarity">${rarityOptionsHtml(draftSimple.rarity)}</select>
        </div>`
      : `<div class="edit-field">
          <span class="edit-label">专属被动对象</span>
          ${exclusiveTargetPickerHtml(draftSimple.personalTarget, 'personalTarget')}
          <div class="hint">下面标记为"通用"的被动，装备给任何单位都会生效；标记为"专属"的被动，只有装备给这里选择的单位（或该元素的单位）时才会生效（可以选多个，例如：Tuji或Gojo装备时才触发第2、3个被动）。</div>
        </div>
        <div class="edit-field">
          <span class="edit-label">稀有度</span>
          <select class="edit-select" data-bind="rarity">${rarityOptionsHtml(draftSimple.rarity)}</select>
        </div>`;

    container.innerHTML = `
      <div class="page-toolbar">
        <div class="crumb">编辑${cfg.label}</div>
        <div class="toolbar-actions">
          <button class="btn" id="cancelBtn">取消</button>
          <button class="btn btn-gold" id="saveBtn">保存</button>
        </div>
      </div>
      <div class="edit-field">
        <input class="edit-input title-input" data-bind="name" value="${escapeHtml(draftSimple.name)}" placeholder="${cfg.label}名称">
        <input class="edit-input" style="margin-top:8px;" data-bind="englishName" value="${escapeHtml(draftSimple.englishName||'')}" placeholder="英文名（可选，方便搜索）">
      </div>

      <div class="edit-field">
        <span class="edit-label">图片</span>
        <div class="image-upload-box">
          ${draftSimple.image ? `<img class="image-preview zoomable" src="${draftSimple.image}">` : `<div class="image-placeholder">无图片</div>`}
          <div class="upload-controls">
            <label class="file-label">选择图片<input type="file" accept="image/*" data-image-bind="image" style="display:none;"></label>
            ${draftSimple.image ? `<button class="btn btn-danger" data-image-remove="image" style="width:fit-content;">移除图片</button>` : ''}
          </div>
        </div>
      </div>

      ${restrictFieldHtml}

      <div class="edit-field">
        <span class="edit-label">获取方式</span>
        ${obtainMethodPickerHtml(draftSimple.obtainMethods, 'obtainMethods')}
      </div>

      <div class="edit-field">
        <span class="edit-label">被动（可新增多个）</span>
        ${draftSimple.passives.map((p,i)=>passiveCardHtml(p,i,'passives', true)).join('') || '<div class="empty-hint" style="padding-left:0;">暂无被动</div>'}
        <button class="btn btn-gold" data-action="addPassive" data-path="passives">+ 新增被动</button>
      </div>

      <div class="edit-field">
        <span class="edit-label">状态标记</span>
        <div class="mark-row-list">
          ${state.marks.length ? state.marks.map(m=> markToggleHtml(m, draftSimple.marks.includes(m.id))).join('') : ''}
        </div>
        ${state.marks.length===0 ? '<div class="hint">还没有可用的标记，可以在下面直接新增，比如持续伤害、灼烧、流血。</div>' : '<div class="hint">点击标记以添加或移除。</div>'}
        <div class="mark-quickadd">
          <input class="edit-input" id="newMarkName" placeholder="新标记名称，例如：中毒">
          <label class="file-label" style="margin:0;">图标（可选）<input type="file" accept="image/*" id="newMarkImageInput" style="display:none;"></label>
          <button class="btn btn-gold" id="addMarkInlineBtn" type="button">+ 添加标记</button>
        </div>
      </div>

      ${type==='memory' ? `<div class="edit-field">
        <span class="edit-label">使魔</span>
        <div class="mark-row-list">
          ${state.families.length ? state.families.map(f=> familyToggleHtml(f, draftSimple.linkedFamilies.includes(f.id))).join('') : ''}
        </div>
        ${state.families.length===0 ? '<div class="hint">还没有使魔，可以先到左侧「使魔」页面新增。</div>' : '<div class="hint">点击选择这个记忆关联的使魔，再点一次可取消选择。</div>'}
      </div>` : ''}

      <div class="save-bar">
        <button class="btn btn-danger" id="deleteBtn">删除${cfg.label}</button>
      </div>
    `;

    wireDraftForm(container, draftSimple);
    wirePickerToggles(container);

    let pendingNewMarkImage = '';
    const newMarkImageInput = document.getElementById('newMarkImageInput');
    if(newMarkImageInput) newMarkImageInput.addEventListener('change', (e)=>{
      handleImageUpload(e.target, (dataUrl)=>{ pendingNewMarkImage = dataUrl; showToast('图标已选择'); });
    });
    const addMarkInlineBtn = document.getElementById('addMarkInlineBtn');
    if(addMarkInlineBtn) addMarkInlineBtn.addEventListener('click', async ()=>{
      const nameInput = document.getElementById('newMarkName');
      const name = nameInput.value.trim();
      if(!name){ showToast('请输入标记名称'); return; }
      const newMark = {id:uid(), name, image:pendingNewMarkImage, color:'#c9a24b'};
      state.marks.push(newMark);
      draftSimple.marks.push(newMark.id);
      await saveData(true);
      renderMain();
    });

    document.getElementById('cancelBtn').addEventListener('click', ()=>{ editMode=false; draftSimple=null; render(); });
    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      entity.name = (draftSimple.name||'').trim() || cfg.unnamed;
      entity.englishName = (draftSimple.englishName||'').trim();
      entity.image = draftSimple.image || '';
      entity.passives = draftSimple.passives || [];
      entity.marks = draftSimple.marks || [];
      if(type==='family'){
        entity.exclusiveTarget = Array.isArray(draftSimple.exclusiveTarget) ? draftSimple.exclusiveTarget : [];
      }
      if(type==='memory'){
        entity.personalTarget = Array.isArray(draftSimple.personalTarget) ? draftSimple.personalTarget : [];
        entity.linkedFamilies = draftSimple.linkedFamilies || [];
      }
      entity.rarity = draftSimple.rarity || '';
      entity.obtainWay = draftSimple.obtainWay || '';
      entity.obtainMethods = Array.isArray(draftSimple.obtainMethods) ? draftSimple.obtainMethods : [];
      entity.updatedAt = Date.now();
      editMode = false;
      draftSimple = null;
      await saveData(false);
      render();
    });
    document.getElementById('deleteBtn').addEventListener('click', async ()=>{
      if(!confirm(`删除「${entity.name}」？此操作无法撤销。`)) return;
      state[cfg.collection] = state[cfg.collection].filter(e=>e.id!==entity.id);
      currentView = {type:'home'};
      editMode = false;
      draftSimple = null;
      await saveData(false);
      render();
    });
    return;
  }

  const marksHtml = (entity.marks&&entity.marks.length) ? entity.marks.map(mid=>{
    const m = state.marks.find(x=>x.id===mid);
    if(!m) return '';
    const icon = m.image ? `<img src="${m.image}">` : '';
    return `<span class="mark-chip" style="${coloredChipStyle(m.color)}" title="${escapeHtml(m.description||m.name)}">${icon}${escapeHtml(m.name)}</span>`;
  }).join('') : '';

  let restrictChipHtml = '';
  {
    const target = type==='family' ? entity.exclusiveTarget : entity.personalTarget;
    const resolved = resolveExclusiveTargets(target);
    if(resolved.length){
      restrictChipHtml = resolved.map(r=>`<span class="badge badge-common" style="background:var(--card);color:var(--text-faint);">专属被动对象：${escapeHtml(r.entity.name)}</span>`).join('');
    }
  }
  const rarityChipHtml = entity.rarity ? rarityBadge(entity.rarity) : '';

  const passivesHtml = (entity.passives&&entity.passives.length) ? entity.passives.map(p=>{
    const scopeTag = `<span class="badge ${p.scope==='personal'?'badge-legendary':'badge-common'}" style="${p.scope==='personal'?'':'background:var(--card);color:var(--text-faint);'}margin-left:8px;">${p.scope==='personal'?'专属':'通用'}</span>`;
    return `<div class="skill-view" style="display:block;">
      <h3 class="skill-name">${escapeHtml(p.name)}${scopeTag}</h3>
      <div class="content-body">${renderMarkdownLite(p.description)}</div>
    </div>`;
  }).join('') : '<p style="color:var(--text-faint);">暂无内容</p>';

  const linkedFamiliesHtml = (type==='memory' && entity.linkedFamilies && entity.linkedFamilies.length) ? `<div class="mark-row-list">${entity.linkedFamilies.map(fid=>{
    const f = state.families.find(x=>x.id===fid);
    if(!f) return '';
    const icon = f.image ? `<img src="${f.image}">` : '';
    return `<a href="${viewToHash({type:'family', id:f.id})}" class="mark-chip" data-view="family" data-id="${f.id}" style="${coloredChipStyle('#4a8fd1')}cursor:pointer;">${icon}${escapeHtml(f.name)}</a>`;
  }).join('')}</div>` : '';

  container.innerHTML = `
    <div class="page-toolbar">
      <div class="crumb">${cfg.label}</div>
      <div class="toolbar-actions">${backButtonHtml()}${isAdmin ? '<button class="btn" id="editBtn">编辑</button>' : '<span class="view-only-note" style="margin:0;padding:6px 12px;">仅查看</span>'}</div>
    </div>
    ${entity.image ? `<img class="unit-image zoomable" src="${entity.image}">` : ''}
    <div class="page-header">
      <h1 class="page-title">${escapeHtml(entity.name)}</h1>
      ${entity.englishName ? `<div class="unit-english-name">${escapeHtml(entity.englishName)}</div>` : ''}
      <div class="meta-row">${rarityChipHtml}${restrictChipHtml}${(entity.obtainMethods&&entity.obtainMethods.length) ? entity.obtainMethods.map(id=>{
        const t = state.obtainMethods.find(x=>x.id===id);
        return t ? `<span class="mark-chip" style="${coloredChipStyle(t.color)}">${t.image?`<img src="${t.image}">`:''}${escapeHtml(t.name)}</span>` : '';
      }).join('') : (entity.obtainWay?`<span class="badge badge-common" style="background:var(--card);color:var(--text-faint);">获取：${escapeHtml(entity.obtainWay)}</span>`:'')}${marksHtml}</div>
    </div>
    <div class="section-label">被动</div>
    ${passivesHtml}
    ${linkedFamiliesHtml ? `<div class="section-label">使魔</div>${linkedFamiliesHtml}` : ''}
    ${commentsSectionHtml(entity, type)}
  `;
  const editBtn = document.getElementById('editBtn'); if(editBtn) editBtn.addEventListener('click', ()=>{ if(!requireAdmin()) return; startSimpleEdit(type, entity); render(); });
  wireBackButton(container);
  wireComments(container);
  container.querySelectorAll('.mark-chip[data-view="family"]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      if(!isPlainLeftClick(e)) return;
      e.preventDefault();
      goToView({type:'family', id: chip.dataset.id});
      editMode = false; draftUnit=null; draftSimple=null;
      render();
    });
  });
}

  return `<input class="edit-input" data-settings-color-formula="${pathPrefix}.${i}.color" value="${isGradient?escapeHtml(colorVal):''}" placeholder="自定义颜色公式，例如渐变色 linear-gradient(...)" style="max-width:230px;">`;
}

function dbSizeReportHtml(){
  const limitBytes = 1048487;
  const sizeOf = (obj)=>{ try{ return new Blob([JSON.stringify(obj)]).size; }catch(e){ return 0; } };

  let biggestMeta = {key:'', bytes:0};
  META_KEYS.forEach(key=>{
    const bytes = sizeOf(state[key]);
    if(bytes > biggestMeta.bytes) biggestMeta = {key, bytes};
  });

  let biggest = {name:'', label:'', bytes:0};
  ENTITY_COLLECTIONS.forEach(name=>{
    const label = name==='units'?'单位':name==='items'?'物品':name==='families'?'使魔':'记忆';
    (state[name]||[]).forEach(entity=>{
      const bytes = sizeOf(entity);
      if(bytes > biggest.bytes) biggest = {name: entity.name||'未命名', label, bytes};
    });
  });

  const worstBytes = Math.max(biggestMeta.bytes, biggest.bytes);
  const pct = Math.min(100, Math.round((worstBytes/limitBytes)*100));
  const barColor = pct >= 90 ? '#e05555' : (pct >= 70 ? '#c9a24b' : 'var(--teal)');

  return `<details class="settings-block" open>
    <summary class="section-label" style="margin-top:0;">数据库大小</summary>
    <div class="hint" style="margin-bottom:10px;">现在的存储方式是：每个单位/物品/使魔/记忆各自存成一份独立文档；更新日志、状态标记、特性、稀有度、获取方式、分级榜、Odyssey模式等也都<b>各自单独存成一份文档</b>，互不共用额度。以后新增的功能，也会照这个规则各自拆开存。Firestore 对<b>单个文档</b>的1MB上限还在，但现在是分开算的——只有"某一份具体的文档自己"异常庞大，才会撑到上限，不会因为整体内容变多就全部一起炸掉。</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;height:10px;margin-bottom:8px;">
      <div style="width:${pct}%;height:100%;background:${barColor};"></div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);margin-bottom:4px;">占用最多的一份文档：${(worstBytes/1024).toFixed(1)} KB / 1024 KB（${pct}%）</div>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:12px;">
      占用最多的设置类文档：${biggestMeta.key||'（暂无）'} ${biggestMeta.bytes?`(${(biggestMeta.bytes/1024).toFixed(1)} KB)`:''}　|　占用最多的单条数据：${biggest.label?`${escapeHtml(biggest.label)}「${escapeHtml(biggest.name)}」`:'（暂无）'} ${biggest.bytes?`(${(biggest.bytes/1024).toFixed(1)} KB)`:''}
    </div>
    ${pct>=85 ? `<div class="hint" style="color:#e05555;margin-bottom:12px;">⚠️ 上面提到的这份文档快满了，去检查一下它是不是有图片/视频没走Cloudinary直接存进来了。</div>` : ''}
  </details>`;
}

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">状态标记</summary>
      <div class="hint" style="margin-bottom:14px;">管理可用于单位的状态效果标记，例如持续伤害（DOT）、灼烧、流血等。每个标记可以上传一个小图标，选择所属分类，编辑单位时可以勾选添加。</div>
      <div id="marksList">${marksHtml}</div>
      <button class="btn btn-gold" id="addMarkBtn">+ 新增标记</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">获取方式</summary>
      <div class="hint" style="margin-bottom:14px;">管理可选的获取方式标签，例如 Raids、Story Stage、常驻招募、限时活动。编辑单位/使魔/记忆时，可以点开列表勾选（可多选），不用再手打文字。</div>
      <div id="obtainMethodsList">${obtainMethodsHtml}</div>
      <button class="btn btn-gold" id="addObtainMethodBtn">+ 新增获取方式</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">攻击类型</summary>
      <div class="hint" style="margin-bottom:14px;">管理攻击方式可以选择的攻击类型，例如 AOE、CONE（扇形）、半圆。编辑单位攻击方式时可以直接选，不用手打文字；左侧栏的「攻击类型」页面会把每个类型的说明列出来给大家查阅。</div>
      <div id="attackTypesList">${attackTypesHtml}</div>
      <button class="btn btn-gold" id="addAttackTypeBtn">+ 新增攻击类型</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">分组</summary>
      <div class="hint" style="margin-bottom:14px;">管理单位所属的分组，例如忍者、骑士、女巫。每个分组可以上传一个小图标，编辑单位时可以选择所属分组。</div>
      <div id="groupsList">${groupsHtml}</div>
      <button class="btn btn-gold" id="addGroupBtn">+ 新增分组</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">元素</summary>
      <div class="hint" style="margin-bottom:14px;">管理单位的元素属性，例如火、水、风、雷等。编辑单位时可以在稀有度下方选择所属元素。</div>
      <div id="elementsList">${elementsHtml}</div>
      <button class="btn btn-gold" id="addElementBtn">+ 新增元素</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">系列 / 活动</summary>
      <div class="hint" style="margin-bottom:14px;">管理皮肤所属的系列或活动分类，例如夏日、冬日、周年庆、春季等。编辑皮肤时可以选择所属系列。</div>
      <div id="seriesList">${seriesHtml}</div>
      <button class="btn btn-gold" id="addSeriesBtn">+ 新增系列</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">稀有度</summary>
      <div class="hint" style="margin-bottom:14px;">管理稀有度名称和颜色，会应用到整个图鉴中的标签与列表标记。颜色支持渐变（比如神话稀有度），在后面的文本框粘贴 CSS 渐变即可。</div>
      <div id="rarityColorList">${rarityRowsHtml}</div>
      <button class="btn btn-gold" id="addRarityBtn">+ 新增稀有度</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">特性</summary>
      <div class="hint" style="margin-bottom:14px;">管理单位可以挂载的特性（比如 Monarch、Ethereal、Solar），每个特性可以填写概率、保底、简介、数值加成，以及一个可选的对照表。在单位编辑页「攻击方式」上方选好特性后，会自动应用到这个单位<b>所有</b>攻击方式的伤害/范围/攻速上；浏览页面点击特性标签就能弹出这里填写的详细数值。</div>
      <div id="traitsList">${traitsHtml}</div>
      <button class="btn btn-gold" id="addTraitBtn">+ 新增特性</button>
    </details>

    <details class="settings-block">
      <summary class="section-label" style="margin-top:0;">管理员账号</summary>
      <div class="hint" style="margin-bottom:14px;">
        浏览网站本来就不需要账号，任何人拿到链接都能直接查看。<br>
        这里管理的是"哪些登录账号算管理员（可以编辑）"：每行填一个邮箱。你可以先去 Firebase 控制台的 Authentication 里新建一个账号给别人用，只要那个账号的邮箱<b>不在</b>下面的名单里，对方登录后就只能查看，看不到任何编辑按钮，等于一个"普通账号"。<br>
        <b>注意：</b>如果这里留空，为了不把你自己锁在外面，系统会把"任何成功登录的账号"都当作管理员；只要填了至少一个邮箱，就会严格按名单判断。
      </div>
      <textarea class="edit-input" id="adminEmailsTextarea" rows="4" placeholder="admin@example.com&#10;another-admin@example.com">${escapeHtml((state.adminEmails||[]).join('\n'))}</textarea>
      <div class="hint" style="margin-top:6px;">当前登录账号：${isAdmin ? (auth&&auth.currentUser?escapeHtml(auth.currentUser.email):'（未知）') : '未登录'}</div>
    </details>
  `;

  const adminEmailsTextarea = document.getElementById('adminEmailsTextarea');
  if(adminEmailsTextarea){
    const syncAdminEmails = async ()=>{
      state.adminEmails = adminEmailsTextarea.value.split('\n').map(s=>s.trim()).filter(Boolean);
      await saveData(true);
      if(auth && auth.currentUser){ isAdmin = computeIsAdmin(auth.currentUser); renderAuthFoot(); }
    };
    adminEmailsTextarea.addEventListener('blur', syncAdminEmails);
  }

  container.querySelectorAll('[data-settings-bind]').forEach(el=>{
    const sync = ()=>{
      setPath(state, el.dataset.settingsBind, el.value);
      pendingLocalSave = true;
      clearTimeout(settingsSyncTimer);
      settingsSyncTimer = setTimeout(()=>{ saveData(true); }, 400);
    };
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
  });
  container.querySelectorAll('[data-settings-image-bind]').forEach(el=>{
    el.addEventListener('change', ()=>{
      handleImageUpload(el, async (dataUrl)=>{
        setPath(state, el.dataset.settingsImageBind, dataUrl);
        await saveData(true);
        renderSettings();
      });
    });
  });
  container.querySelectorAll('[data-settings-action]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const action = el.dataset.settingsAction;
      const idx = parseInt(el.dataset.index);
      if(action==='removeMark') state.marks.splice(idx,1);
      else if(action==='moveMarkUp') moveArrayItem(state.marks, idx, -1);
      else if(action==='moveMarkDown') moveArrayItem(state.marks, idx, 1);
      else if(action==='removeMarkCategory') state.markCategories.splice(idx,1);
      else if(action==='removeItemCategory') state.itemCategories.splice(idx,1);
      else if(action==='removeObtainMethod') state.obtainMethods.splice(idx,1);
      else if(action==='removeAttackType') state.attackTypes.splice(idx,1);
      else if(action==='removeGroup') state.groups.splice(idx,1);
      else if(action==='removeElement') state.elements.splice(idx,1);
      else if(action==='removeSeries') state.series.splice(idx,1);
      else if(action==='removeTrait') state.traits.splice(idx,1);
      else if(action==='removeRarity') state.rarities.splice(idx,1);
      else if(action==='moveRarityUp'){
        if(idx>0){ const tmp=state.rarities[idx-1]; state.rarities[idx-1]=state.rarities[idx]; state.rarities[idx]=tmp; }
      }
      else if(action==='moveRarityDown'){
        if(idx<state.rarities.length-1){ const tmp=state.rarities[idx+1]; state.rarities[idx+1]=state.rarities[idx]; state.rarities[idx]=tmp; }
      }
      await saveData(true);
      renderSettings();
    });
  });
  const addBtn = document.getElementById('addMarkBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    state.marks.push({id:uid(), name:'新标记', image:'', color:'#c9a24b', categoryId:'', description:''});
    await saveData(true);
    renderSettings();
  });
  const addMarkCategoryBtn = document.getElementById('addMarkCategoryBtn');
  if(addMarkCategoryBtn) addMarkCategoryBtn.addEventListener('click', async ()=>{
    state.markCategories.push({id:uid(), name:'新分类', color:'#c9a24b'});
    await saveData(true);
    renderSettings();
  });
  const addItemCategoryBtn = document.getElementById('addItemCategoryBtn');
  if(addItemCategoryBtn) addItemCategoryBtn.addEventListener('click', async ()=>{
    state.itemCategories.push({id:uid(), name:'新分类', color:'#4a8fd1'});
    await saveData(true);
    renderSettings();
  });
  const addObtainMethodBtn = document.getElementById('addObtainMethodBtn');
  if(addObtainMethodBtn) addObtainMethodBtn.addEventListener('click', async ()=>{
    state.obtainMethods.push({id:uid(), name:'新获取方式', image:'', color:'#4a8fd1'});
    await saveData(true);
    renderSettings();
  });
  const addAttackTypeBtn = document.getElementById('addAttackTypeBtn');
  if(addAttackTypeBtn) addAttackTypeBtn.addEventListener('click', async ()=>{
    state.attackTypes.push({id:uid(), name:'新攻击类型', image:'', color:'#4a8fd1', description:''});
    await saveData(true);
    renderSettings();
  });
  const settingsSaveBtn = document.getElementById('settingsSaveBtn');
  if(settingsSaveBtn) settingsSaveBtn.addEventListener('click', async ()=>{
    if(document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
    settingsSaveBtn.disabled = true;
    const original = settingsSaveBtn.textContent;
    settingsSaveBtn.textContent = '保存中...';
    await saveData(false);
    settingsSaveBtn.disabled = false;
    settingsSaveBtn.textContent = original;
  });
  const recoverBtn = document.getElementById('recoverFromLegacyBtn');
  if(recoverBtn) recoverBtn.addEventListener('click', async ()=>{
    if(!requireAdmin()) return;
    if(!confirm('确定要从旧版备份数据强制恢复吗？这会用旧数据覆盖你现在看到的内容（如果现在显示是空的/不对的，这正是你想要的）。')) return;
    recoverBtn.disabled = true;
    recoverBtn.textContent = '恢复中...';
    try{
      const legacySnap = await docRef.get();
      if(!legacySnap.exists || !legacySnap.data().json){
        showToast('没有找到旧版备份数据（wiki/data 这份文档是空的或不存在）。', 8000);
      } else {
        state = JSON.parse(legacySnap.data().json);
        migrateState();
        await saveData(false);
        showToast('已从旧版数据恢复并重新保存！', 5000);
        render();
      }
    }catch(e){
      showToast(`恢复失败：${e && e.message ? e.message : '请检查网络或权限'}`, 10000);
      console.error('recover error:', e);
    }
    recoverBtn.disabled = false;
    recoverBtn.textContent = '🔄 从旧版数据强制恢复';
  });
  const untickLimitedReturnBtn = document.getElementById('untickLimitedReturnBtn');
  if(untickLimitedReturnBtn) untickLimitedReturnBtn.addEventListener('click', async ()=>{
    const checked = Array.from(document.querySelectorAll('.limited-return-checkbox:checked')).map(el=>el.dataset.unitId);
    if(!checked.length){ showToast('先勾选想取消标记的单位', 3000); return; }
    checked.forEach(id=>{
      const u = state.units.find(x=>x.id===id);
      if(u) u.isLimitedReturn = false;
    });
    await saveData(true);
    showToast(`已取消 ${checked.length} 个单位的限定复刻标记`, 4000);
    renderSettings();
  });
  const addGroupBtn = document.getElementById('addGroupBtn');
  if(addGroupBtn) addGroupBtn.addEventListener('click', async ()=>{
    state.groups.push({id:uid(), name:'新分组', image:'', color:'#4a8b7c'});
    await saveData(true);
    renderSettings();
  });
  const addElementBtn = document.getElementById('addElementBtn');
  if(addElementBtn) addElementBtn.addEventListener('click', async ()=>{
    state.elements.push({id:uid(), name:'新元素', image:'', color:'#4a8fd1'});
    await saveData(true);
    renderSettings();
  });
  const addSeriesBtn = document.getElementById('addSeriesBtn');
  if(addSeriesBtn) addSeriesBtn.addEventListener('click', async ()=>{
    state.series.push({id:uid(), name:'新系列', image:'', color:'#c9a24b'});
    await saveData(true);
    renderSettings();
  });
  const addRarityBtn = document.getElementById('addRarityBtn');
  if(addRarityBtn) addRarityBtn.addEventListener('click', async ()=>{
    state.rarities.push({id:uid(), name:'新稀有度', color:'#c9a24b'});
      await saveData(true);
    renderSettings();
  });
  const addTraitBtn = document.getElementById('addTraitBtn');
  if(addTraitBtn) addTraitBtn.addEventListener('click', async ()=>{
    state.traits.push({id:uid(), name:'新特性', image:'', color:'#c9a24b', odds:'', pity:'', tagline:'', statLines:'', tableHeaders:'', tableRows:''});
    await saveData(true);
    renderSettings();
  });
  container.querySelectorAll('[data-settings-color-formula]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const v = el.value.trim();
      if(v){ setPath(state, el.dataset.settingsColorFormula, v); }
          await saveData(true);
      renderSettings();
    });
  });
  wireCollapsibleBlocks(container, '.settings-block', 'settings');
  wireBackButton(container);
}

function render(){
  const titleEl = document.getElementById('siteTitle');
  if(titleEl && document.activeElement !== titleEl) titleEl.value = state.siteTitle || '动漫先锋 (Anime Vanguard) Wiki';
  if(titleEl) titleEl.readOnly = !isAdmin;
  document.title = state.siteTitle || '动漫先锋 (Anime Vanguard) Wiki';
  renderSidebar();
  renderMain();
}

document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('siteTitle').addEventListener('change', async (e)=>{
  if(!isAdmin){ e.target.value = state.siteTitle; showToast('请先登录管理员账号才能编辑'); return; }
  state.siteTitle = e.target.value.trim() || '动漫先锋 (Anime Vanguard) Wiki';
  await saveData(true);
});
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value.trim();
  renderSidebar();
});

window.addEventListener('beforeunload', ()=>{
  if(settingsSyncTimer){ clearTimeout(settingsSyncTimer); saveData(true); }
  if(saveTimer){ clearTimeout(saveTimer); saveData(true); }
});

loadData();

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxVideo = document.getElementById('lightboxVideo');
document.addEventListener('click', (e)=>{
  if(!e.target || !e.target.classList || !e.target.classList.contains('zoomable')) return;
  if(e.target.tagName === 'IMG'){
    lightboxVideo.pause();
    lightboxVideo.style.display = 'none';
    lightboxImg.style.display = '';
    lightboxImg.src = e.target.src;
    lightbox.classList.add('show');
  } else if(e.target.tagName === 'VIDEO'){
    lightboxImg.style.display = 'none';
    lightboxVideo.style.display = '';
    lightboxVideo.src = e.target.currentSrc || e.target.src;
    lightbox.classList.add('show');
    lightboxVideo.play().catch(()=>{});
  }
});
function closeLightbox(){
  lightbox.classList.remove('show');
  lightboxVideo.pause();
}
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
document.getElementById('lightboxClose').addEventListener('click', (e)=>{ e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeLightbox(); closeTraitOverlay(); } });

</script>
</body>
</html>
