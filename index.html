<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动漫先锋 (Anime Vanguard) Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161f; --panel:#1a1d2b; --card:#1f2333; --card-hover:#252a3d;
    --border:#2c3145; --border-light:#3a3f57;
    --gold:#c9a24b; --gold-dim:#8a713a; --teal:#4a8b7c;
    --text:#ece6d4; --text-dim:#a8a294; --text-faint:#8f8a78;
    --danger:#b8544a;
    --common:#8a8a8a; --rare:#4a8fd1; --epic:#a56bd1; --legendary:#c9a24b;
    --exclusive:#d17dc9; --secret:#8f4fd1; --vanguard:#3f9e8f; --mythic:#ff1493;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;height:100%;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px;}
  h1,h2,h3,.display{font-family:'Noto Serif SC',serif;letter-spacing:.02em;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .app{display:flex;height:100vh;overflow:hidden;}

  .sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sidebar-head{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
  .site-title{font-size:20px;font-weight:700;color:var(--gold);margin:0 0 2px;background:transparent;border:none;outline:none;width:100%;font-family:'Noto Serif SC',serif;padding:0;}
  .site-sub{font-size:11px;color:var(--text-faint);letter-spacing:.1em;}
  .search-wrap{padding:12px 16px;border-bottom:1px solid var(--border);}
  .search-input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;}
  .search-results-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:600;padding:12px 12px 6px;}
  .search-clear-btn{background:none;border:none;color:var(--gold-dim);font-size:11px;text-transform:none;letter-spacing:0;cursor:pointer;padding:2px 4px;}
  .search-clear-btn:hover{color:var(--gold);}
  .search-result-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:none;color:var(--text-dim);padding:9px 12px;border-radius:6px;font-size:13.5px;text-align:left;cursor:pointer;text-decoration:none;}
  .search-result-item:hover{background:var(--card-hover);color:var(--text);}
  .search-result-sub{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
  .search-input:focus{border-color:var(--gold-dim);}
  .cat-nav{padding:10px 8px;flex:1;overflow-y:auto;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-weight:700;margin:16px 10px 6px;display:flex;align-items:center;gap:7px;}
  .nav-collapsible{margin:0;}
  .nav-collapsible summary{list-style:none;cursor:pointer;}
  .nav-collapsible summary::-webkit-details-marker{display:none;}
  .nav-collapsible summary.nav-section-label{justify-content:space-between;padding:2px 10px 2px 0;}
  .nav-collapsible summary.nav-section-label::after{content:'▸';margin-left:auto;font-size:10px;color:var(--text-faint);transition:transform .15s, color .15s;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .nav-collapsible summary.nav-section-label:hover::after{background:var(--card-hover);color:var(--gold);}
  .nav-collapsible[open] summary.nav-section-label::after{transform:rotate(90deg);color:var(--gold-dim);}
  .nav-collapsible summary .cat-add{text-transform:none;letter-spacing:0;font-weight:600;margin-left:6px;}
  .nav-sub-link{padding-left:26px !important;font-size:13px;}
  .nav-sub-link[draggable="true"]{cursor:grab;}
  .nav-sub-link.dragging{opacity:.35;cursor:grabbing;}
  .nav-sub-link.drag-over{outline:2px dashed var(--gold);outline-offset:-2px;border-radius:6px;}
  .nav-section-label::before{content:'';width:5px;height:5px;background:var(--gold-dim);transform:rotate(45deg);flex-shrink:0;}
  .nav-section:first-child .nav-section-label{margin-top:2px;}
  .nav-icon{width:16px;text-align:center;flex-shrink:0;opacity:.85;}
  .top-link{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--text-dim);padding:10px 10px;border-radius:6px;font-size:14px;text-align:left;font-weight:500;margin-bottom:2px;text-decoration:none;box-shadow:inset 3px 0 0 transparent;transition:background .12s, box-shadow .12s, color .12s;}
  .top-link:hover{background:var(--card);color:var(--text);}
  .top-link.active{background:var(--card);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);font-weight:700;}
  .cat-group{margin:10px 0 4px;}
  .cat-head{display:flex;align-items:center;gap:6px;padding:2px 10px;border-radius:6px;box-shadow:inset 3px 0 0 transparent;transition:box-shadow .12s;}
  .cat-head:has(.cat-label-btn.active){box-shadow:inset 3px 0 0 var(--gold);}
  .cat-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-weight:600;flex:1;}
  .cat-label-btn{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text-dim);font-weight:500;flex:1;background:none;border:none;text-align:left;padding:8px 0;cursor:pointer;text-decoration:none;}
  .cat-label-btn:hover{color:var(--text);}
  .cat-label-btn.active{color:var(--gold);font-weight:700;}
  .cat-label-btn .nav-icon{opacity:.9;}
  .cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);background:var(--card-hover);border-radius:20px;padding:1px 8px;}
  .cat-label-btn.active .cat-count{color:var(--gold-dim);}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px;}
  .odyssey-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:8px;}
  .odyssey-card{display:flex;flex-direction:column;background:linear-gradient(165deg, var(--card) 0%, var(--panel) 130%);border:1px solid var(--border);border-top:3px solid var(--teal);border-radius:10px;padding:14px;text-align:center;}
  .odyssey-card-img-wrap{position:relative;width:100%;margin-bottom:10px;}
  .odyssey-card-img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:var(--card-hover);display:block;}
  .odyssey-card-rarity-badge{display:inline-block;width:fit-content;margin:0 auto 10px;font-size:10.5px;font-weight:700;color:#fff;padding:3px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4);}
  .odyssey-card-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:14.5px;color:var(--text);margin-bottom:10px;}
  .odyssey-card-desc{font-size:13px;color:var(--text-dim);line-height:1.55;white-space:pre-line;text-align:left;}
  .odyssey-card-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-faint);text-align:center;}
  .floor-list{display:flex;flex-direction:column;gap:14px;margin-bottom:8px;}
  .floor-card{display:flex;gap:14px;flex-wrap:wrap;background:linear-gradient(165deg, var(--card) 0%, var(--panel) 130%);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:10px;padding:14px 16px;}
  a.floor-card{text-decoration:none;color:inherit;transition:border-color .15s, transform .15s;cursor:pointer;}
  a.floor-card:hover{border-color:var(--gold-dim);transform:translateX(2px);}
  .floor-card-body{flex:1;min-width:200px;padding:0;}
  .floor-card-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;color:var(--text);margin-bottom:6px;}
  .floor-card-desc{font-size:13.5px;color:var(--text-dim);line-height:1.7;white-space:pre-line;}
  .odyssey-card-unit-tag{display:inline-block;font-size:11px;color:var(--teal);background:rgba(63,158,143,.12);border:1px solid var(--teal);border-radius:20px;padding:2px 10px;margin-bottom:6px;cursor:pointer;text-decoration:none;}
  .odyssey-card-editable-wrap{position:relative;}
  .odyssey-card-edit-btn{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;background:rgba(20,22,31,.75);color:#fff;border:1px solid var(--border-light);border-radius:20px;padding:4px 10px;cursor:pointer;backdrop-filter:blur(2px);}
  .odyssey-card-edit-btn:hover{background:var(--gold);border-color:var(--gold);color:#14161f;}
  .odyssey-card-unit-tag:hover{background:rgba(63,158,143,.25);}
  .gallery-card{text-align:center;cursor:pointer;transition:opacity .15s, outline-color .15s;text-decoration:none;display:block;color:inherit;}
  .gallery-card-img-wrap{position:relative;}
  .gallery-card-limited-tag{position:absolute;top:6px;right:6px;font-size:13px;background:rgba(20,22,31,.75);border:1px solid var(--teal);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  .gallery-card[draggable="true"]{cursor:grab;}
  .gallery-card.dragging{opacity:.35;cursor:grabbing;}
  .gallery-card.drag-over{outline:2px dashed var(--gold);outline-offset:3px;border-radius:8px;}
  .gallery-card-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--border);background:var(--card);display:block;}
  .gallery-card-placeholder{width:100%;aspect-ratio:1;border-radius:12px;border:1px dashed var(--border-light);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px;}
  .gallery-card-name{font-size:13px;color:var(--text-dim);margin-top:8px;}
  .gallery-card-en{display:block;font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .gallery-card:hover .gallery-card-img,.gallery-card:hover .gallery-card-placeholder{border-color:var(--gold-dim);}
  .gallery-card:hover .gallery-card-name{color:var(--gold);}
  .rarity-section{margin-bottom:32px;}
  .rarity-section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;list-style:none;user-select:none;}
  .rarity-section-head::-webkit-details-marker{display:none;}
  .rarity-section-head:hover{opacity:.85;}
  .rarity-section-count{font-size:12px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
  .rarity-section-arrow{margin-left:auto;font-size:11px;color:var(--text-faint);transition:transform .15s;}
  .rarity-section[open] .rarity-section-arrow{transform:rotate(90deg);}
  .rarity-section:not([open]){margin-bottom:10px;}
  .rarity-section-peek{display:flex;}
  .rarity-section-peek img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-8px;background:var(--card-hover);}
  .rarity-section-peek img:first-child{margin-left:0;}
  .gallery-search-bar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 14px;margin-bottom:16px;}
  .gallery-category-filter{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .gallery-category-chip{border:none;cursor:pointer;font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;font-family:inherit;background:var(--card);color:var(--text-faint);opacity:.65;transition:opacity .12s, transform .1s;}
  .gallery-category-chip:hover{opacity:1;}
  .gallery-category-chip.active{opacity:1;box-shadow:inset 0 0 0 1.5px currentColor;}
  .gallery-category-chip[data-cat-filter=""]{background:var(--card);color:var(--text-dim);}
  .gallery-category-chip[data-cat-filter=""].active{background:var(--gold);color:#14161f;box-shadow:none;}
  .gallery-search-icon{font-size:13px;opacity:.6;}
  .gallery-search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;}
  .gallery-search-input::placeholder{color:var(--text-faint);}
  .gallery-stats-bar{margin-bottom:18px;}
  .gallery-stats-total{display:block;font-size:12px;color:var(--text-faint);margin-bottom:9px;}
  .gallery-distribution-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-bottom:11px;background:var(--card-hover);}
  .gallery-distribution-seg{cursor:pointer;transition:opacity .15s;}
  .gallery-distribution-seg:hover{opacity:.7;}
  .gallery-stats-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .gallery-stats-chip{border:none;cursor:pointer;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;font-family:inherit;}
  .gallery-stats-chip b{font-family:'JetBrains Mono',monospace;margin-left:3px;}
  .gallery-stats-chip:hover{filter:brightness(1.15);}
  .gallery-recent-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;}
  .gallery-recent-card{flex-shrink:0;width:78px;text-align:center;text-decoration:none;color:inherit;}
  .gallery-recent-img{width:78px;height:78px;border-radius:10px;object-fit:cover;background:var(--card-hover);border:1px solid var(--border);transition:border-color .15s, transform .15s;}
  .gallery-recent-card:hover .gallery-recent-img{border-color:var(--gold-dim);transform:translateY(-2px);}
  .gallery-recent-name{font-size:11px;color:var(--text-dim);margin-top:5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-add{background:none;border:1px solid var(--border);color:var(--text-faint);width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;}
  .cat-add:hover{color:var(--gold);border-color:var(--gold-dim);}
  .page-list{padding:2px 0 10px;}
  .page-item{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:6px;font-size:13px;color:var(--text-dim);border-left:2px solid transparent;}
  .page-item:hover{background:var(--card);color:var(--text);cursor:pointer;}
  .page-item.active{background:var(--card);color:var(--text);border-left-color:var(--gold);}
  .thumb{width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--card-hover);}
  .rarity-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .page-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .empty-hint{padding:6px 10px 10px 18px;font-size:12px;color:var(--text-faint);}
  .group-label{font-size:10.5px;color:var(--text-faint);padding:7px 10px 3px 18px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}

  .main{flex:1;overflow-y:auto;position:relative;}
  .main-inner{max-width:820px;margin:0 auto;padding:44px 48px 80px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;color:var(--text-faint);}
  .empty-state h2{color:var(--text-dim);margin-bottom:8px;}

  .page-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:10px;flex-wrap:wrap;}
  .crumb{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.1em;}
  .crumb a{color:var(--gold-dim);text-decoration:none;}
  .crumb a:hover{color:var(--gold);text-decoration:underline;}
  .toolbar-actions{display:flex;gap:8px;}
  .btn{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--card-hover);color:var(--text);}
  .btn-gold{border-color:var(--gold-dim);color:var(--gold);}
  .btn-gold:hover{background:rgba(201,162,75,.1);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:rgba(184,84,74,.1);}

  .unit-hero{display:flex;gap:30px;margin-bottom:26px;padding-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .unit-hero-image{flex:0 0 240px;max-width:240px;}
  .unit-hero-info{flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;padding-top:4px;}
  .page-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .unit-hero-info .page-header{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .page-title{font-size:32px;margin:0 0 4px;color:var(--text);}
  .unit-english-name{color:var(--text-faint);font-size:14px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em;margin-bottom:14px;}
  .meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .badge-limited-return{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;font-family:'Noto Sans SC',sans-serif;color:var(--teal);background:rgba(63,158,143,.14);border:1px solid var(--teal);border-radius:20px;padding:3px 10px;}
  .checkbox-field{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
  .limited-return-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
  .limited-return-row:hover{border-color:var(--gold-dim);}
  .limited-return-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
  .limited-return-row img,.limited-return-row .mark-icon-placeholder{width:28px;height:28px;border-radius:6px;object-fit:cover;background:var(--card-hover);flex-shrink:0;}
  .checkbox-field input[type="checkbox"]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
  .meta-row + .stat-plate{margin-top:14px;}
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.05em;}
  .badge-common{background:rgba(138,138,138,.15);color:var(--common);}
  .badge-rare{background:rgba(74,143,209,.15);color:var(--rare);}
  .badge-epic{background:rgba(165,107,209,.15);color:var(--epic);}
  .badge-legendary{background:rgba(201,162,75,.15);color:var(--legendary);}
  .badge-exclusive{background:rgba(209,125,201,.15);color:var(--exclusive);}
  .badge-secret{background:rgba(143,79,209,.15);color:var(--secret);}
  .badge-vanguard{background:rgba(63,158,143,.15);color:var(--vanguard);}

  .unit-image{width:100%;max-width:320px;border-radius:10px;border:1px solid var(--border);display:block;margin-bottom:24px;background:var(--card);object-fit:cover;}
  .unit-image-wrap{position:relative;max-width:320px;margin-bottom:24px;}
  .unit-image-wrap .unit-image{margin-bottom:0;}
  .unit-hero-image .unit-image-wrap{max-width:100%;margin-bottom:0;}
  .unit-hero-image .unit-image{max-width:100%;box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--gold-dim), 0 16px 36px -16px rgba(0,0,0,.65);}
  .shiny-toggle-btn{position:absolute;top:10px;right:10px;background:rgba(20,22,31,.85);border:1px solid var(--gold-dim);color:var(--gold);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;backdrop-filter:blur(2px);}
  .shiny-toggle-btn:hover{background:rgba(20,22,31,.95);border-color:var(--gold);}
  .shiny-toggle-btn.active{background:var(--gold);color:#14161f;border-color:var(--gold);}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold-dim);font-weight:600;margin:1.8em 0 .8em;display:flex;align-items:center;gap:9px;}
  .section-label::before{content:'';width:6px;height:6px;background:var(--gold-dim);transform:rotate(45deg);flex-shrink:0;}
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--border-light), transparent);}
  .stat-plate,.attack-stat-plate{display:flex;flex-wrap:wrap;gap:0;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .stat-cell,.attack-stat-cell{flex:1;min-width:110px;padding:9px 14px;border-right:1px solid var(--border);}
  .stat-cell:last-child,.attack-stat-cell:last-child{border-right:none;}
  .stat-label,.attack-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:600;margin-bottom:3px;}
  .stat-value,.attack-stat-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text);}
  .stat-value .arrow,.attack-stat-value .arrow{color:var(--text-faint);font-weight:400;margin:0 4px;}
  .stat-value .boosted,.attack-stat-value .boosted{color:var(--gold);}
  .content-body{font-size:15px;line-height:1.75;color:#ffffff;}
  .content-body p{margin:0 0 1em;}
  .content-body ul{padding-left:22px;margin:0 0 1em;}
  .content-body li{margin-bottom:6px;}
  .content-body strong{color:var(--gold);font-weight:600;}
  .content-body code{background:var(--card);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(10,11,16,.82);z-index:200;align-items:center;justify-content:center;cursor:zoom-out;padding:40px;}

  .lightbox-close{position:fixed;top:20px;right:24px;background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:201;}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
function rarityLabel(id){ const r = state.rarities.find(r=>r.id===id); return r ? r.name : ''; }

let state = { siteTitle:'动漫先锋 (Anime Vanguard) Wiki', updateLog:[], units:[], items:[], itemCategories:[], families:[], memories:[], tierlist:{content:''}, marks:[], markCategories:[], groups:[], elements:[], series:[], rarities:[], traits:[], adminEmails:[], obtainMethods:[], odyssey:{intro:'', unitIds:[], characterCards:[], basicCards:[], floors:[]}, attackTypes:[], enemyMechanics:[], enemyMechanicCategories:[], stages:[], upgrades:[] };
let currentView = {type:'home'};
let viewHistory = [];
let traitPreviewOverrides = {};
let openPickerKeys = new Set();
let openRaritySections = new Set();
let closedCollapsibleBlocks = new Set();

function wireCollapsibleBlocks(container, blockSelector, keyPrefix){
  container.querySelectorAll(blockSelector).forEach((block, i)=>{
    if(block.dataset.collapsibleWired || block.tagName==='DETAILS') return;
    const label = block.querySelector(':scope > .section-label');
    if(!label) return;
    block.dataset.collapsibleWired = '1';
    const key = keyPrefix + '-' + i;
    label.classList.add('collapsible-toggle');
    const arrow = document.createElement('span');
    arrow.className = 'collapsible-arrow';
    arrow.textContent = '▸';
    label.appendChild(arrow);
    const contentWrap = document.createElement('div');
    contentWrap.className = 'collapsible-content';
    Array.from(block.children).filter(c=>c!==label && c!==contentWrap).forEach(el=> contentWrap.appendChild(el));
    block.appendChild(contentWrap);
    if(!closedCollapsibleBlocks.has(key)) block.classList.add('open');
    label.addEventListener('click', ()=>{
      const nowOpen = block.classList.toggle('open');
      if(nowOpen) closedCollapsibleBlocks.delete(key); else closedCollapsibleBlocks.add(key);
    });
  });
}
function wirePickerToggles(container){
  container.querySelectorAll('details.entity-picker[data-picker-key], details.insert-dot-picker[data-picker-key]').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      if(d.open) openPickerKeys.add(d.dataset.pickerKey);
      else openPickerKeys.delete(d.dataset.pickerKey);
    });
  });
  container.querySelectorAll('.entity-picker-search').forEach(input=>{
    input.addEventListener('input', ()=>{
      const q = input.value.trim().toLowerCase();
      const list = input.closest('.entity-picker-list');
      let anyVisible = false;
      list.querySelectorAll('.entity-picker-item').forEach(btn=>{
        const match = !q || (btn.dataset.search||'').includes(q);
        btn.style.display = match ? '' : 'none';
        if(match) anyVisible = true;
      });
      const noResult = list.querySelector('.entity-picker-noresult');
      if(noResult) noResult.style.display = anyVisible ? 'none' : '';
    });
  });
}
let editMode = false;
let searchQuery = '';
let addingLog = false;
let draftLogEntry = null;
let draftUnit = null;
let draftSimple = null;
let draftOdyssey = null;
let draftStage = null;
let itemEditEvolvesUnitId = '';
let addingCharacterCardForUnit = false;
let newCharacterCardDraft = null;
let draftUpgrade = null;
let draftStageLevel = null;
let showingShinyImage = false;

function viewToHash(view){
  if(!view || !view.type || view.type==='home') return '#/';
  return view.id ? `#/${view.type}/${view.id}` : `#/${view.type}`;
}
const VALID_HASH_TYPES = ['home','tierlist','settings','statusEffects','odyssey','attackTypes','traits','enemyMechanics','stage','stageLevel','upgrade','unit','item','family','memory','unitGallery','itemGallery','familyGallery','memoryGallery'];
function hashToView(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if(!raw) return {type:'home'};
  const parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
  const type = parts[0];
  if(!VALID_HASH_TYPES.includes(type)) return {type:'home'};
  return parts[1] ? {type, id: parts[1]} : {type};
}
function setHash(view){
  const h = viewToHash(view);
  if(location.hash !== h){ suppressNextHashChange = true; location.hash = h; }
}
let suppressNextHashChange = false;

function isPlainLeftClick(e){
  return e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey;
}

function clearUnitTraitPreviewIfLeaving(newView){
  if(currentView.type==='unit' && currentView.id && !(newView.type==='unit' && newView.id===currentView.id)){
    delete traitPreviewOverrides['unit:'+currentView.id];
  }
}
function goToView(view){
  clearUnitTraitPreviewIfLeaving(view);
  const mainEl = document.querySelector('.main');
  viewHistory.push({view: JSON.parse(JSON.stringify(currentView)), scrollTop: mainEl ? mainEl.scrollTop : 0});
  currentView = view;
  setHash(view);
  if(mainEl) mainEl.scrollTop = 0;
}
function goBack(){
  const prev = viewHistory.pop();
  const newView = prev ? prev.view : {type:'home'};
  clearUnitTraitPreviewIfLeaving(newView);
  currentView = newView;
  setHash(currentView);
  editMode=false; draftUnit=null; draftSimple=null; addingLog=false; showingShinyImage=false;
  render();
  const mainEl = document.querySelector('.main');
  if(mainEl) mainEl.scrollTop = prev ? prev.scrollTop : 0;
}
function backButtonHtml(){
  return viewHistory.length ? `<button class="btn" id="backBtn">&larr; 返回</button>` : '';
}
function wireBackButton(container){
  const btn = container.querySelector('#backBtn');
  if(btn) btn.addEventListener('click', goBack);
}

function commentEntityList(type){
  return type==='unit' ? state.units : type==='family' ? state.families : state.memories;
}

function commentDateStr(ts){
  if(!ts) return '';
  try{ return new Date(ts).toISOString().slice(0,10); }catch(e){ return ''; }
}

function commentsSectionHtml(entity, entityType){
  const comments = Array.isArray(entity.comments) ? entity.comments : [];
  const listHtml = comments.length ? comments.map(c=>`
    <div class="comment-item">
      <div class="comment-head">
        <span class="comment-author">${escapeHtml(c.name||'匿名')}</span>
        <span class="comment-date">${commentDateStr(c.createdAt)}</span>
        ${isAdmin ? `<button class="comment-del-btn" data-comment-del="${c.id}">删除</button>` : ''}
      </div>
      <div class="comment-text">${escapeHtml(c.text)}</div>
    </div>`).join('') : `<div class="empty-hint" style="padding-left:0;">还没有评论，来抢沙发吧～</div>`;
  return `
    <div class="section-label">评论 (${comments.length})</div>
    <div class="comments-list" data-entity-type="${entityType}" data-entity-id="${entity.id}">${listHtml}</div>
    <div class="comment-form">
      <input class="edit-input" id="commentNameInput" placeholder="你的昵称（可选，不填就显示匿名）" style="margin-bottom:8px;">
      <textarea class="edit-input" id="commentTextInput" rows="3" placeholder="说点什么..."></textarea>
      <button class="btn btn-gold" id="commentSubmitBtn" style="margin-top:8px;" data-entity-type="${entityType}" data-entity-id="${entity.id}">发布评论</button>
    </div>
  `;
}

function wireComments(container){
  const submitBtn = container.querySelector('#commentSubmitBtn');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const nameInput = container.querySelector('#commentNameInput');
      const textInput = container.querySelector('#commentTextInput');
      const text = (textInput.value||'').trim();
      if(!text){ showToast('评论内容不能为空'); return; }
      const name = (nameInput.value||'').trim() || '匿名';
      const type = submitBtn.dataset.entityType;
      const id = submitBtn.dataset.entityId;
      const entity = commentEntityList(type).find(e=>e.id===id);
      if(!entity) return;
      if(!Array.isArray(entity.comments)) entity.comments = [];
      entity.comments.push({id:uid(), name, text, createdAt:Date.now()});
      submitBtn.disabled = true;
      await saveData(true);
      showToast('评论已发布');
      render();
    });
  }
  container.querySelectorAll('[data-comment-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireAdmin()) return;
      if(!confirm('删除这条评论？')) return;
      const wrap = btn.closest('.comments-list');
      const type = wrap.dataset.entityType;
      const id = wrap.dataset.entityId;
      const entity = commentEntityList(type).find(e=>e.id===id);
      if(!entity) return;
      entity.comments = (entity.comments||[]).filter(c=>c.id!==btn.dataset.commentDel);
      await saveData(false);
      render();
    });
  });
}

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function handleGalleryImgError(imgEl){
  const placeholder = document.createElement('div');
  placeholder.className = 'gallery-card-placeholder';
  placeholder.textContent = '⚠️ 图片加载失败';
  imgEl.replaceWith(placeholder);
}
function moveArrayItem(arr, index, delta){
  const target = index + delta;
  if(target<0 || target>=arr.length) return;
  const [item] = arr.splice(index,1);
  arr.splice(target,0,item);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null ? o : o[k]), obj);
}

function defaultData(){
  const now = Date.now();
  return {
    siteTitle:'动漫先锋 (Anime Vanguard) Wiki',
    updateLog:[
      {id:uid(), date:todayStr(), title:'Wiki 上线', content:'欢迎使用 动漫先锋 (Anime Vanguard) Wiki！在左侧栏可以添加单位与物品，点击「分级榜」可以查看/编辑分级榜内容。', updatedAt: now}
    ],
    units:(()=>{
      const exampleUnitId = uid();
      window.__exampleUnitId = exampleUnitId;
      return [{
        id: exampleUnitId, name:'炎焰骑士', image:'', rarity:'epic', tags:['近战','火属性'], group:null, placementLimit:'2',
        passives:[
          {id:uid(), name:'烈焰护体', description:'**触发条件：** 生命值低于30%\n\n获得等于最大生命值20%的护盾，并在6秒内提升15%攻速。每45秒只能触发一次。'},
          {id:uid(), name:'炙热之刃', description:'普通攻击有几率附加灼烧效果。'}
        ],
        skills:[
          {id:uid(), name:'烈焰突刺', image:'', description:'向前突进并造成范围火焰伤害。'},
          {id:uid(), name:'熔岩壁', image:'', description:'召唤火墙阻挡敌人前进。'}
        ],

function hexToRgba(hex, alpha){
  hex = (hex||'#c9a24b').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function computeIsAdmin(user){
  if(!user) return false;
  const list = (state.adminEmails||[]).map(e=>(e||'').toLowerCase().trim()).filter(Boolean);
  if(!list.length) return true; // 还没设置管理员名单时，任何登录账号都视为管理员（避免把自己锁在外面）
  return list.includes((user.email||'').toLowerCase().trim());

let authReadyResolved = false;
let resolveAuthReady;
const authReadyPromise = new Promise(res=>{ resolveAuthReady = res; });
// Safety net: if Firebase Auth never fires onAuthStateChanged at all (this can happen when the
// page is opened as a local file:// URL, which Chrome treats as a broken/blocked origin for some
// Firebase Auth internals), don't let loadData() hang forever — proceed after a few seconds anyway.
setTimeout(()=>{ if(!authReadyResolved){ authReadyResolved = true; resolveAuthReady(); } }, 3000);

function initFirebase(){
  if(firebaseConfig.apiKey === "YOUR_API_KEY"){
    showToast('尚未配置 Firebase，数据不会保存，请查看代码顶部的设置说明');
    return false;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  docRef = db.collection('wiki').doc('data'); // legacy single-document store, kept only for one-time migration reads
  auth.onAuthStateChanged((user)=>{
    isAdmin = computeIsAdmin(user);
    if(!authReadyResolved){ authReadyResolved = true; resolveAuthReady(); }
    renderAuthFoot();
    render();
  });
  return true;
}

function renderAuthFoot(){
  const foot = document.getElementById('authFoot');
  if(!foot) return;
  if(isAdmin){
    foot.innerHTML = `<div class="auth-status"><span class="admin-badge">👑 管理员模式</span><button class="auth-logout-btn" id="logoutBtn">退出</button></div>`;
    document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut(); });
  } else {
    foot.innerHTML = `<button class="auth-login-btn" id="openLoginBtn">管理员登录</button>`;
    document.getElementById('openLoginBtn').addEventListener('click', openLoginModal);
  }
}

    const p = parseFloat(pct);
    if(isNaN(p) || !p) return null;
    return `${p>0?'+':''}${p}% ${label}`;
  };
  const autoLines = [pctLine('Damage', t.damagePct), pctLine('SPA', t.spaPct), pctLine('Range', t.rangePct)].filter(Boolean);
  const statLines = autoLines.concat((t.statLines||'').split('\n').map(s=>s.trim()).filter(Boolean));
  const statsHtml = statLines.length ? `<ul class="trait-detail-stats">${statLines.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>` : '';
  const headers = (t.tableHeaders||'').split('|').map(s=>s.trim()).filter(Boolean);
  const rows = (t.tableRows||'').split('\n').map(r=>r.split('|').map(c=>c.trim())).filter(r=>r.length>1 && r[0]);
  const tableHtml = (headers.length===2 && rows.length) ? `<table class="trait-detail-table">
    <thead><tr><th>${escapeHtml(headers[0])}</th><th>${escapeHtml(headers[1])}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${escapeHtml(r[0]||'')}</td><td>${escapeHtml(r[1]||'')}</td></tr>`).join('')}</tbody>
  </table>` : '';
  return `
    <div class="trait-detail-head">
      ${iconHtml}
      <div>
        <div class="trait-detail-name" style="color:${/gradient/.test(t.color||'')?'var(--gold)':(t.color||'var(--gold)')};">${escapeHtml(t.name)}</div>
        <div class="trait-detail-sub">${[t.odds, t.pity].filter(Boolean).map(escapeHtml).join('&nbsp;&nbsp;')}</div>
      </div>
    </div>
    <div class="trait-detail-body">
      <div style="flex:1;min-width:200px;">
        ${t.tagline ? `<div class="trait-detail-tagline">${escapeHtml(t.tagline)}</div>` : ''}
        ${statsHtml}
      </div>
      ${tableHtml}
    </div>
  `;
}

      </div>

        <div class="hint"># 标题、## 小标题、**加粗**、\`代码\`、- 列表 均可使用。</div>

      </div>
      <div class="edit-field">
        <span class="edit-label">敌方机制</span>
        <div class="hint" style="margin-bottom:8px;">整个关卡分类（比如这个地下城）普遍会遇到的敌方机制，点击选中（可多选）。想新增机制种类，去左侧「敌方机制」页面里编辑。</div>
        <div class="mark-row-list">
          ${state.enemyMechanics.length ? state.enemyMechanics.map(m=> enemyMechanicToggleHtml(m, draftStage.mechanics.includes(m.id))).join('') : '<div class="empty-hint" style="padding-left:0;">还没有敌方机制，去左侧「敌方机制」页面新增。</div>'}
        </div>
      </div>
      <div class="edit-field">
        <span class="edit-label">关卡 (每一关)</span>
        <div class="hint" style="margin-bottom:10px;">在这里加关卡、改名字、删除、拖动排序。每一关详细的说明和商店，保存后点进那一关自己的页面里编辑，不用全部挤在这里。</div>
        ${draftStage.levels.map((lv,i)=>stageLevelListEditRowHtml(lv,i)).join('') || '<div class="empty-hint" style="padding-left:0;">暂无关卡</div>'}
        <button class="btn btn-gold" data-action="addStageLevel">+ 添加关</button>
      </div>
    `;
    wireDraftForm(container, draftStage);
    wirePickerToggles(container);
    document.getElementById('cancelBtn').addEventListener('click', ()=>{ editMode=false; draftStage=null; render(); });
    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      stage.name = (draftStage.name||'').trim() || '未命名关卡';
      stage.image = draftStage.image || '';
      stage.description = draftStage.description || '';
      stage.mechanics = draftStage.mechanics || [];
      stage.levels = draftStage.levels || [];
      editMode = false; draftStage = null;
      await saveData(false);
      render();
    });
    document.getElementById('deleteStageBtn').addEventListener('click', async ()=>{
      if(!confirm(`确定删除「${stage.name}」这个关卡分类？`)) return;
      state.stages = state.stages.filter(s=>s.id!==stage.id);
      editMode = false; draftStage = null;
      currentView = {type:'home'}; setHash(currentView);
      await saveData(false);
      render();
    });
    return;
  }

  const levelsHtml = stage.levels.length ? stage.levels.map(lv=>{
    const hints = [];
    if(lv.mechanics && lv.mechanics.length) hints.push(`☠️ ${lv.mechanics.length} 个机制`);
    if(lv.shop && lv.shop.length) hints.push(`🛒 商店 · ${lv.shop.length} 件商品`);
    const descText = hints.length ? hints.join(' · ') : (lv.description ? '点击查看关卡详情' : '<span style="color:var(--text-faint);">暂无说明</span>');
    return `
    <a href="${viewToHash({type:'stageLevel', id: stage.id+'__'+lv.id})}" class="floor-card" data-view="stageLevel" data-id="${stage.id+'__'+lv.id}" data-level-id="${lv.id}"${isAdmin ? ' draggable="true"' : ''}>
      ${lv.image ? `<img class="skill-image" src="${lv.image}">` : ''}
      <div class="floor-card-body">
        <div class="floor-card-name">${inline(lv.name)}</div>
        <div class="floor-card-desc">${descText}</div>
      </div>
    </a>`;
  }).join('') : '<div class="empty-hint" style="padding-left:0;">暂无关卡</div>';

  const stageMechanicsHtml = (stage.mechanics&&stage.mechanics.length) ? stage.mechanics.map(mid=>{
    const m = state.enemyMechanics.find(x=>x.id===mid);
    if(!m) return '';
    const icon = m.image ? `<img src="${m.image}">` : '';
    return `<span class="mark-chip" style="${coloredChipStyle(m.color)}" title="${escapeHtml(m.description||m.name)}">${icon}${escapeHtml(m.name)}</span>`;
  }).join('') : '';

  container.innerHTML = `
    <div class="page-toolbar">
      <div class="crumb">关卡</div>
      <div class="toolbar-actions">${backButtonHtml()}${isAdmin ? '<button class="btn" id="editBtn">编辑</button>' : ''}</div>
    </div>
    ${stage.image ? `<img class="unit-image zoomable" src="${stage.image}">` : ''}
    <h1 class="page-title" style="margin-bottom:12px;">${escapeHtml(stage.name)}</h1>
    ${stageMechanicsHtml ? `<div class="mark-row-list" style="margin-bottom:20px;">${stageMechanicsHtml}</div>` : ''}
    <div class="content-body">${renderMarkdownLite(stage.description) || '<p style="color:var(--text-faint);">暂无说明</p>'}</div>
    <div class="section-label">关卡列表</div>
    ${isAdmin && stage.levels.length>1 ? `<div class="hint" style="margin:-6px 0 12px;">💡 点击关卡进入详情页；按住卡片拖动可以调整关卡顺序。</div>` : ''}
    <div class="floor-list" id="stageLevelsList">${levelsHtml}</div>
  `;
  const editBtn = document.getElementById('editBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ if(!requireAdmin()) return; editMode=true; draftStage=null; render(); });
  wireBackButton(container);

  const listEl = document.getElementById('stageLevelsList');
  listEl.querySelectorAll('.floor-card[data-level-id]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(!isPlainLeftClick(e)) return;
      e.preventDefault();
      goToView({type:'stageLevel', id: card.dataset.id});
      editMode = false; draftStage=null; draftStageLevel=null;
      render();
    });
  });

  if(isAdmin){
    let dragSrcId = null;
    listEl.querySelectorAll('.floor-card[data-level-id]').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragSrcId = card.dataset.levelId;
        card.classList.add('dragging');
        if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        listEl.querySelectorAll('.floor-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
        dragSrcId = null;
      });
      card.addEventListener('dragover', (e)=>{
        if(!dragSrcId || card.dataset.levelId===dragSrcId) return;
        e.preventDefault();
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over'); });
      card.addEventListener('drop', async (e)=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        const targetId = card.dataset.levelId;
        if(!dragSrcId || dragSrcId===targetId) return;
        const srcIdx = stage.levels.findIndex(x=>x.id===dragSrcId);
        if(srcIdx<0) return;
        const [moved] = stage.levels.splice(srcIdx,1);
        const tgtIdx = stage.levels.findIndex(x=>x.id===targetId);
        stage.levels.splice(tgtIdx<0 ? stage.levels.length : tgtIdx, 0, moved);
        dragSrcId = null;
        await saveData(true);
        renderStagePage();
      });
    });
  }
}

function shopRefOptionsHtml(item){
  const optGroup = (label, list, type) => list.length ? `<optgroup label="${label}">${list.map(x=>`<option value="${type}:${x.id}" ${item.refType===type&&item.refId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</optgroup>` : '';
  const itemOptGroups = state.itemCategories.length
    ? state.itemCategories.map(cat=>{
        const inCat = state.items.filter(x=>x.categoryId===cat.id);
        return inCat.length ? `<optgroup label="物品 · ${escapeHtml(cat.name)}">${inCat.map(x=>`<option value="item:${x.id}" ${item.refType==='item'&&item.refId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</optgroup>` : '';
      }).join('') + optGroup('物品 · 未分类', state.items.filter(x=>!x.categoryId || !state.itemCategories.some(c=>c.id===x.categoryId)), 'item')
    : optGroup('物品', state.items, 'item');
  return `<option value="">选择关联内容...</option>
    ${itemOptGroups}
    ${optGroup('单位', state.units, 'unit')}
    ${optGroup('使魔', state.families, 'family')}
    ${optGroup('记忆', state.memories, 'memory')}`;
}

const ENTITY_COLLECTIONS = ['units','items','families','memories'];
// Every top-level piece of "site config" data gets its own small document in the `meta` collection.
// To give something new its own document in the future, just add its state key to this list.
const META_KEYS = ['siteTitle','updateLog','tierlist','marks','markCategories','groups','elements','series','rarities','traits','adminEmails','obtainMethods','odyssey','attackTypes','enemyMechanics','enemyMechanicCategories','stages','upgrades','itemCategories'];

async function fetchEntityCollection(name){
  const snap = await db.collection(name).get();
  const docs = snap.docs.slice().sort((a,b)=>(a.data().order||0)-(b.data().order||0));
  const list = docs.map(d=> d.data().json ? JSON.parse(d.data().json) : null).filter(Boolean);
  knownIds[name] = new Set(snap.docs.map(d=>d.id));
  const cache = {};
  docs.forEach(d=>{ if(d.data().json) cache[d.id] = {json: d.data().json, order: d.data().order||0}; });
  lastSavedJson[name] = cache;
  return list;
}

async function loadData(){
  const ok = initFirebase();
  if(!ok){
    state = defaultData();
    migrateState();
      renderAuthFoot();
    render();
    return;
  }

  // Wait for Firebase Auth to finish restoring any existing login session first.
  // Otherwise a migration write below could go out with no auth token attached yet
  // and get silently rejected by the "write requires login" security rule.
  await authReadyPromise;

  // Entity collections (units/items/families/memories) don't depend on which meta format
  // is in use, so kick them off now and let them load in parallel with the meta lookup below
  // instead of waiting for it — this is usually the slowest part of the initial page load.
  const entitiesPromise = Promise.all(ENTITY_COLLECTIONS.map(fetchEntityCollection));

  let metaCollectionSnap = null;
  let metaReadFailed = false;
  try{ metaCollectionSnap = await db.collection('meta').get(); }
  catch(e){ metaReadFailed = true; console.error('meta collection read failed:', e); }

  try{
    const metaByKey = {};
    if(metaCollectionSnap){
      metaCollectionSnap.docs.forEach(d=>{ if(META_KEYS.includes(d.id) && d.data().json) metaByKey[d.id] = JSON.parse(d.data().json); });
    }
    if(Object.keys(metaByKey).length){
      // New per-key format
      state = defaultData();
      Object.keys(metaByKey).forEach(k=> state[k] = metaByKey[k]);
      const metaCache = {};
      metaCollectionSnap.docs.forEach(d=>{ if(META_KEYS.includes(d.id) && d.data().json) metaCache[d.id] = d.data().json; });
      lastSavedJson.meta = metaCache;
      const [units, items, families, memories] = await entitiesPromise;
      state.units = units; state.items = items; state.families = families; state.memories = memories;
    } else {
      // Nothing readable in the new per-key format — try the previous single-meta-doc format,
      // then the oldest single-document-for-everything format, as one-time migrations.
      let legacyMetaSnap = null;
      try{ legacyMetaSnap = await db.collection('meta').doc('data').get(); }
      catch(e){ console.error('legacy meta doc read failed:', e); }

      if(legacyMetaSnap && legacyMetaSnap.exists && legacyMetaSnap.data().json){
        const legacyMeta = JSON.parse(legacyMetaSnap.data().json);
        state = defaultData();
        Object.keys(legacyMeta).forEach(k=> state[k] = legacyMeta[k]);
        const [units, items, families, memories] = await entitiesPromise;
        state.units = units; state.items = items; state.families = families; state.memories = memories;
        migrateState();
        showToast('检测到旧格式设置数据，正在迁移到分开存储的新格式...', 5000);
        await saveData(true);
        showToast('迁移完成', 4000);
      } else {
        let legacySnap = null;
        try{ legacySnap = await docRef.get(); }
        catch(e){ console.error('legacy doc read failed:', e); }

        if(legacySnap && legacySnap.exists && legacySnap.data().json){
          state = JSON.parse(legacySnap.data().json);
          migrateState();
          showToast('检测到旧格式数据，正在迁移到新的存储结构（分开存储以避开1MB限制）...', 5000);
          await saveData(true);
          showToast('迁移完成，已保存为新格式', 4000);
        } else if(metaReadFailed){
          // Could not read any format at all — this is almost certainly a Firestore
          // security-rules problem, not actually missing data. Do NOT auto-save blank defaults here,
          // to avoid any risk of overwriting real data once the rules are fixed.
          state = defaultData();
          migrateState();
          showToast('⚠️ 无法读取数据库，很可能是 Firestore 安全规则还没开放新的存储路径导致的权限问题——不是数据被删除了。你的原始数据大概率还完整保存在数据库里。在确认权限问题解决之前，请不要在这个页面保存任何修改！', 20000);
          renderAuthFoot();
          render();
          return;
        } else {
          state = defaultData();
          migrateState();
          await saveData(true);
        }
      }
    }
  }catch(e){
    state = defaultData();
    showToast('⚠️ 连接数据库失败，可能是网络问题或 Firestore 权限规则问题——你的数据大概率没有丢失。请检查后再操作，弄清楚之前不要保存修改！', 15000);
    console.error('loadData error:', e);
  }
  migrateState();
  if(auth && auth.currentUser) isAdmin = computeIsAdmin(auth.currentUser);
  currentView = hashToView();
  if(!location.hash) setHash(currentView);
  window.addEventListener('hashchange', ()=>{
    if(suppressNextHashChange){ suppressNextHashChange = false; return; }
    currentView = hashToView();
    editMode = false; draftUnit=null; draftSimple=null; draftOdyssey=null; showingShinyImage=false; addingCharacterCardForUnit=false; newCharacterCardDraft=null; editingOdysseyCardId=null;
    render();
    const mainEl = document.querySelector('.main');
    if(mainEl) mainEl.scrollTop = 0;
  });
  renderAuthFoot();
  render();

  // Live sync: reflect other people's edits without a manual refresh
  db.collection('meta').onSnapshot((snap)=>{
    if(snap.metadata.hasPendingWrites) return; // our own write echoing back
    if(pendingLocalSave) return; // don't let a stale remote snapshot clobber an edit we're about to save
    applyingRemoteUpdate = true;
    snap.docs.forEach(d=>{
      if(META_KEYS.includes(d.id) && d.data().json){
        state[d.id] = JSON.parse(d.data().json);
        lastSavedJson.meta[d.id] = d.data().json;
      }
    });
    migrateState();
    render();
    applyingRemoteUpdate = false;
  });
  ENTITY_COLLECTIONS.forEach(name=>{
    db.collection(name).onSnapshot((snap)=>{
      if(snap.metadata.hasPendingWrites) return;
      if(pendingLocalSave) return;
      applyingRemoteUpdate = true;
      const docs = snap.docs.slice().sort((a,b)=>(a.data().order||0)-(b.data().order||0));
      state[name] = docs.map(d=> d.data().json ? JSON.parse(d.data().json) : null).filter(Boolean);
      knownIds[name] = new Set(snap.docs.map(d=>d.id));
      const cache = {};
      docs.forEach(d=>{ if(d.data().json) cache[d.id] = {json: d.data().json, order: d.data().order||0}; });
      lastSavedJson[name] = cache;
      migrateState();
      render();
      applyingRemoteUpdate = false;
    });
  });
}

let pendingLocalSave = false;
let saveTimer = null;
let settingsSyncTimer = null;
const LIMIT_BYTES = 1048487; // Firestore's per-document hard limit is ~1MiB (1,048,576 bytes), minus a little overhead

function saveData(silent){
  return new Promise((resolve)=>{
    clearTimeout(saveTimer);
    pendingLocalSave = true;
    const doSave = async ()=>{
      if(!db){ pendingLocalSave = false; resolve(); return; }
      try{
        const writes = [];
        let oversizedMetaKey = null;
        META_KEYS.forEach(key=>{
          const json = JSON.stringify(state[key]);
          if(json === lastSavedJson.meta[key]) return; // unchanged since last save — skip the network write
          const bytes = new Blob([json]).size;
          if(bytes > LIMIT_BYTES && !oversizedMetaKey) oversizedMetaKey = {key, bytes};
          writes.push({type:'set', ref: db.collection('meta').doc(key), data:{json}, cacheKind:'meta', cacheId:key, cacheJson:json});
        });
        if(oversizedMetaKey){
          showToast(`保存失败：「${oversizedMetaKey.key}」这部分数据已经超过单个文档1MB上限（约${(oversizedMetaKey.bytes/1024/1024).toFixed(2)}MB）。如果是更新日志，建议删掉一些旧记录。`, 10000);
          pendingLocalSave = false; resolve(); return;
        }

        let oversizedEntity = null;
        ENTITY_COLLECTIONS.forEach(name=>{
          const currentIds = new Set();
          (state[name]||[]).forEach((entity, idx)=>{
            currentIds.add(entity.id);
            const entityJson = JSON.stringify(entity);
            const cacheEntry = lastSavedJson[name][entity.id];
            if(cacheEntry && cacheEntry.json === entityJson && cacheEntry.order === idx) return; // unchanged — skip
            const entityBytes = new Blob([entityJson]).size;
            if(entityBytes > LIMIT_BYTES && !oversizedEntity){
              oversizedEntity = {name, entity, bytes: entityBytes};
            }
            writes.push({type:'set', ref: db.collection(name).doc(entity.id), data:{json: entityJson, order: idx}, cacheKind:name, cacheId:entity.id, cacheJson:entityJson, cacheOrder:idx});
          });
          (knownIds[name] || new Set()).forEach(id=>{
            if(!currentIds.has(id)){
              writes.push({type:'delete', ref: db.collection(name).doc(id), cacheKind:name, cacheId:id, deleted:true});
            }
          });
          knownIds[name] = currentIds;
        });

        if(oversizedEntity){
          showToast(`保存失败：「${escapeHtml(oversizedEntity.entity.name||'未命名')}」这一条数据超过了1MB上限（约${(oversizedEntity.bytes/1024/1024).toFixed(2)}MB），可能是图片/视频没有走Cloudinary而是直接存了进去。请检查它的图片设置。`, 12000);
          pendingLocalSave = false; resolve(); return;
        }

        if(writes.length === 0){
          if(!silent) showToast('没有改动，无需保存');
          pendingLocalSave = false; resolve(); return;
        }

        // Chunk into batches of ≤450 operations to stay safely under Firestore's 500-op batch limit as the site grows
        const totalChunks = Math.ceil(writes.length/450);
        for(let i=0;i<writes.length;i+=450){
          const chunkNum = Math.floor(i/450)+1;
          if(!silent && totalChunks>1) showToast(`保存中... (${chunkNum}/${totalChunks})`, 60000);
          else if(!silent && writes.length>1) showToast(`保存中... 共 ${writes.length} 处改动`, 60000);
          const batch = db.batch();
          const chunk = writes.slice(i,i+450);
          chunk.forEach(w=>{
            if(w.type==='set') batch.set(w.ref, w.data);
            else batch.delete(w.ref);
          });
          await batch.commit();
          // Only update the cache after a successful commit, so a failed save doesn't wrongly mark things as saved
          chunk.forEach(w=>{
            if(w.cacheKind==='meta'){
              if(w.deleted) delete lastSavedJson.meta[w.cacheId]; else lastSavedJson.meta[w.cacheId] = w.cacheJson;
            } else {
              if(w.deleted) delete lastSavedJson[w.cacheKind][w.cacheId];
              else lastSavedJson[w.cacheKind][w.cacheId] = {json:w.cacheJson, order:w.cacheOrder};
            }
          });
        }
        if(!silent) showToast('已保存');
      }
      catch(e){
        if(e && e.code === 'permission-denied'){
          showToast('⚠️ 保存失败：Firestore 权限规则不允许写入（可能是新的存储路径 meta/units/items/families/memories 还没加到规则里）。请检查 Firestore 安全规则。', 12000);
        } else {
          showToast(`保存失败：${e && e.message ? e.message : '请检查网络或 Firebase 设置'}`, 8000);
        }
        console.error('saveData error:', e);
      }
      pendingLocalSave = false;
      resolve();
    };
    if(silent){ doSave(); } else { saveTimer = setTimeout(doSave, 200); }
  });
}

function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), duration || 1800);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderMarkdownLite(text){
  const lines = (text||'').split('\n');
  let html=''; let inList=false;
  for(let line of lines){
    if(/^###\s+/.test(line)){ if(inList){html+='</ul>';inList=false;} html += `<h3>${inline(line.replace(/^###\s+/,''))}</h3>`; continue; }
    if(/^##\s+/.test(line)){ if(inList){html+='</ul>';inList=false;} html += `<h2>${inline(line.replace(/^##\s+/,''))}</h2>`; continue; }
    if(/^#\s+/.test(line)){ if(inList){html+='</ul>';inList=false;} html += `<h1>${inline(line.replace(/^#\s+/,''))}</h1>`; continue; }
    if(/^-\s+/.test(line)){ if(!inList){html+='<ul>';inList=true;} html += `<li>${inline(line.replace(/^-\s+/,''))}</li>`; continue; }
    if(inList){ html+='</ul>'; inList=false; }
    if(line.trim()===''){ html += '<br>'; continue; }
    html += `<p>${inline(line)}</p>`;
  }
  if(inList) html+='</ul>';
  return html;
}
function inline(s){
  let e = escapeHtml(s);
  e = e.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  e = e.replace(/`(.+?)`/g, '<code>$1</code>');
  e = e.replace(/\[\[([^\|\]]+?)(?:\|([^\]]+))?\]\]/g, (match, name, val) => renderInlineMarkToken(name.trim(), val ? val.trim() : ''));
  return e;
}
function renderInlineMarkToken(name, val){
  const m = state.marks.find(x=>x.name===name) || state.elements.find(x=>x.name===name) || state.groups.find(x=>x.name===name) || state.enemyMechanics.find(x=>x.name===name);
  const icon = (m && m.image) ? `<img src="${m.image}">` : (m ? '' : `<span class="mark-dot" style="background:var(--gold)"></span>`);
  const styleAttr = m ? ` style="${coloredChipStyle(m.color)}"` : '';
  const titleAttr = (m && m.description) ? ` title="${escapeHtml(m.description)}"` : '';
  return `<span class="mark-chip mark-chip-inline"${styleAttr}${titleAttr}>${icon}${name}${val?(' '+val):''}</span>`;
}

function matchesSearch(hayParts){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return hayParts.join(' ').toLowerCase().includes(q);
}

function rarityDotColor(rarityId){
  const r = state.rarities.find(x=>x.id===rarityId);

}

function coloredChipStyle(color){
  const raw = color || '#8a8a8a';
  return `background:${raw};color:#ffffff;`;
}

function cnNum(n){
  const map=['零','一','二','三','四','五','六','七','八','九','十'];
  return (n>=0 && n<=10) ? map[n] : String(n);
}

function dimChipStyle(color){
  const raw = color || '#8a8a8a';
  const isGradient = /gradient/.test(raw);
  return isGradient
    ? `background:${raw};color:#14161f;opacity:.55;`
    : `background:${hexToRgba(raw,0.18)};color:${raw};`;
}

function toggleChipStyle(color, isActive){
  if(!isActive) return dimChipStyle(color);
  const raw = color || '#8a8a8a';
  return `background:${raw};color:#ffffff;`;
}

function rarityBadge(rarity){
  if(!rarity) return '';
  const r = state.rarities.find(x=>x.id===rarity);
  if(!r) return '';
  const raw = r.color || '#c9a24b';
  return `<span class="badge" style="background:${raw};color:#ffffff;font-weight:700;">${escapeHtml(r.name)}</span>`;
}

function isVideoUrl(url){
  return !!url && (/\/video\/upload\//.test(url) || /\.(mp4|webm|mov|ogg)(\?|$)/i.test(url));
}

function handleImageUpload(inputEl, onDone){
  const file = inputEl.files[0];
  if(!file) return;
  const isVideo = file.type.startsWith('video/');
  const maxSize = 10*1024*1024;
  if(file.size > maxSize){ showToast(isVideo ? '视频过大，你的 Cloudinary 账号限制单个文件最大10MB，请先压缩视频' : '图片过大，你的 Cloudinary 账号限制单个文件最大10MB，请先压缩图片'); return; }
  if(cloudinaryConfig.cloudName === "YOUR_CLOUD_NAME"){
    // Cloudinary not configured — fall back to embedding the file directly (only safe for very small icons, not for video)
    const reader = new FileReader();
    reader.onload = (e) => onDone(e.target.result);
    reader.readAsDataURL(file);
    return;
  }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', cloudinaryConfig.uploadPreset);
  const endpoint = isVideo ? 'video' : 'image';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/${endpoint}/upload`);
  showToast(isVideo ? '视频上传中... 0%' : '图片上传中... 0%', 120000);
  xhr.upload.onprogress = (e)=>{
    if(e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      showToast((isVideo ? '视频上传中... ' : '图片上传中... ') + pct + '%', 120000);
    }
  };
  xhr.onload = ()=>{
    let data;
    try{ data = JSON.parse(xhr.responseText); }
    catch(e){ showToast('上传失败：无法解析服务器响应', 6000); return; }
    if(data.secure_url){
      showToast('上传完成');
      onDone(data.secure_url);
    } else {
      const reason = (data.error && data.error.message) ? data.error.message : '未知错误';
      showToast(`上传失败：${reason}`, 6000);
      console.error('Cloudinary upload error:', data);
    }
  };
  xhr.onerror = ()=>{
    showToast('上传失败，请检查网络或 Cloudinary 设置', 6000);
  };
  xhr.send(formData);
}

  }).join('') : `<div class="empty-hint" style="padding-left:0;">尚未选择获取方式</div>`;

  const pickerHtml = remaining.length ? `<details class="entity-picker" data-picker-key="${key}"${isOpen?' open':''}>
    <summary class="btn btn-gold">+ 选择获取方式</summary>
    <div class="entity-picker-list">

function exclusiveTargetPickerHtml(selectedArr, fieldName){
  const selected = Array.isArray(selectedArr) ? selectedArr : (selectedArr ? [selectedArr] : []);
  const resolved = resolveExclusiveTargets(selected);
  const selectedHtml = resolved.length ? resolved.map(r=>{
    const icon = r.entity.image ? `<img src="${r.entity.image}">` : '';
    return `<button type="button" class="mark-toggle active" style="${toggleChipStyle(r.kind==='element' ? (r.entity.color||'#c9a24b') : '#4a8fd1', true)}" data-action="toggleExclusiveTarget" data-field="${fieldName}" data-target="${r.val}">${icon}${escapeHtml(r.entity.name)} ✕</button>`;
  }).join('') : `<div class="empty-hint" style="padding-left:0;">不限制（未选择）</div>`;

  const remainingUnits = state.units.filter(u=>!selected.includes('unit:'+u.id));
  const remainingElements = state.elements.filter(e=>!selected.includes('element:'+e.id));
  const key = 'target-'+fieldName;
  const isOpen = openPickerKeys.has(key);
  const searchHtml = (remainingUnits.length+remainingElements.length)>5 ? `<input type="text" class="entity-picker-search" placeholder="搜索单位/元素名称（中文/英文均可）...">` : '';
  const pickerHtml = (remainingUnits.length || remainingElements.length) ? `<details class="entity-picker" data-picker-key="${key}"${isOpen?' open':''}>
    <summary class="btn btn-gold">+ 选择单位/元素</summary>
    <div class="entity-picker-list">
      ${searchHtml}
      <div class="entity-picker-items">
        ${remainingUnits.map(u=>`<button type="button" class="entity-picker-item" data-action="toggleExclusiveTarget" data-field="${fieldName}" data-target="unit:${u.id}" data-search="${escapeHtml(((u.name||'')+' '+(u.englishName||'')).toLowerCase())}">${u.image?`<img src="${u.image}">`:''}${escapeHtml(u.name)}${u.englishName?` <span class="entity-picker-en">${escapeHtml(u.englishName)}</span>`:''}</button>`).join('')}
        ${remainingElements.map(e=>`<button type="button" class="entity-picker-item" data-action="toggleExclusiveTarget" data-field="${fieldName}" data-target="element:${e.id}" data-search="${escapeHtml((e.name||'').toLowerCase())}">${e.image?`<img src="${e.image}">`:''}${escapeHtml(e.name)}</button>`).join('')}
      </div>
      <div class="entity-picker-noresult" style="display:none;">没有匹配的单位/元素</div>
    </div>
  </details>` : '';

  return `<div class="mark-row-list">${selectedHtml}</div>${pickerHtml}`;
}

function resolveExclusiveTargets(targets){
  const list = Array.isArray(targets) ? targets : (targets ? [targets] : []);
  return list.map(t=>{
    const [kind, id] = (t||'').split(':');
    if(kind==='unit') return {kind, val:t, entity: state.units.find(u=>u.id===id)};
    if(kind==='element') return {kind, val:t, entity: state.elements.find(e=>e.id===id)};
    return null;
  }).filter(r=>r && r.entity);

function logEntityPickerHtml(label, allEntities, selectedIds, action, idAttr, headerText, pickerKey){
  const rarityTag = (e)=> e.rarity ? rarityBadge(e.rarity) : '';
  const selectedHtml = selectedIds.length ? selectedIds.map(id=>{
    const e = allEntities.find(x=>x.id===id);
    if(!e) return '';
    const icon = e.image ? `<img src="${e.image}">` : '';
    return `<button type="button" class="mark-toggle active" style="${toggleChipStyle('#8a713a',true)}" data-action="${action}" data-${idAttr}="${e.id}">${icon}${escapeHtml(e.name)}${rarityTag(e)} ✕</button>`;
  }).join('') : `<div class="empty-hint" style="padding-left:0;">尚未选择${label}</div>`;
  const remaining = allEntities.filter(e=>!selectedIds.includes(e.id));
  const key = pickerKey || ('log-'+idAttr);
  const isOpen = openPickerKeys.has(key);
  const searchHtml = remaining.length>5 ? `<input type="text" class="entity-picker-search" placeholder="搜索${label}名称（中文/英文均可）...">` : '';
  const pickerHtml = remaining.length ? `<details class="entity-picker" data-picker-key="${key}"${isOpen?' open':''}>
    <summary class="btn btn-gold">+ 选择${label}</summary>
    <div class="entity-picker-list">
      ${searchHtml}
      <div class="entity-picker-items">${remaining.map(e=>`<button type="button" class="entity-picker-item" data-action="${action}" data-${idAttr}="${e.id}" data-search="${escapeHtml(((e.name||'')+' '+(e.englishName||'')).toLowerCase())}">${e.image?`<img src="${e.image}">`:''}${escapeHtml(e.name)}${e.englishName?` <span class="entity-picker-en">${escapeHtml(e.englishName)}</span>`:''}${rarityTag(e)}</button>`).join('')}</div>
      <div class="entity-picker-noresult" style="display:none;">没有匹配的${label}</div>
    </div>
  </details>` : '';
  return `<div class="edit-field">
    <span class="edit-label">${headerText || ('关联'+label)}</span>
    <div class="mark-row-list">${selectedHtml}</div>
    ${pickerHtml}
  </div>`;
}

function logEntityChipsHtml(allEntities, selectedIds, viewType, label){
  if(!selectedIds || !selectedIds.length) return '';
  return `<div class="edit-field" style="margin-top:10px;margin-bottom:0;">
    ${label ? `<span class="edit-label">${label}</span>` : ''}
    <div class="mark-row-list">${selectedIds.map(id=>{
      const e = allEntities.find(x=>x.id===id);
      if(!e) return '';
      const icon = e.image ? `<img src="${e.image}">` : '';
      const limitedTag = e.isLimitedReturn ? `<span title="限定复刻">🔄</span>` : '';
      return `<a href="${viewToHash({type:viewType, id:e.id})}" class="mark-chip" data-view="${viewType}" data-id="${e.id}" style="${coloredChipStyle('#8a713a')}cursor:pointer;">${icon}${limitedTag}${escapeHtml(e.name)}</a>`;
    }).join('')}</div>
  </div>`;
}

          <button class="btn" id="cancelLogBtn">取消</button>

    <div class="page-toolbar">
      <h1 class="page-title" style="margin:0;">更新日志</h1>
      <div class="toolbar-actions">
        ${backButtonHtml()}
        ${isAdmin ? `
        <button class="btn" id="addUnitHomeBtn">+ 新增单位</button>
        <button class="btn" id="addItemHomeBtn">+ 新增物品</button>
        <button class="btn btn-gold" id="addLogBtn">+ 新增日志</button>` : ''}
      </div>
    </div>
    ${addFormHtml}
    <div id="logList" class="log-timeline">
      ${logs.length ? logs.map(l=>{
        const hasLimitedUnit = (l.linkedUnits||[]).some(id=>{
          const u = state.units.find(x=>x.id===id);
          return u && u.isLimitedReturn;
        });
        const limitedText = (l.isLimitedReturn || hasLimitedUnit) ? '限定复刻单位' : '';
        return `
        <div class="log-entry">
          <div class="log-top">
            <div class="log-top-left">
              <span class="log-title">${escapeHtml(l.title)}${limitedText ? ` <span class="badge-limited-return">🔄 ${escapeHtml(limitedText)}</span>` : ''}</span>
              <span class="log-date">${escapeHtml(l.date)}</span>
            </div>
            <div class="log-actions">${isAdmin?`<button class="icon-btn" data-edit-log="${l.id}">编辑</button><button class="icon-btn" data-del-log="${l.id}">删除</button>`:''}</div>
          </div>
          ${l.image ? `<img class="log-image zoomable" src="${l.image}">` : ''}
          <div class="log-content">${renderMarkdownLite(l.content)}</div>
          ${logEntityChipsHtml(state.units, l.linkedUnits, 'unit', '新单位')}
          ${logEntityChipsHtml(state.memories, l.linkedMemories, 'memory', '新记忆')}
          ${logEntityChipsHtml(state.families, l.linkedFamilies, 'family', '新使魔')}

      }).join('') : `<div class="empty-hint" style="padding-left:0;">暂无更新记录</div>`}
    </div>
  `;

  if(addingLog && draftLogEntry){ wireDraftForm(container, draftLogEntry); wirePickerToggles(container); }

  const addUnitHomeBtn = document.getElementById('addUnitHomeBtn');
  if(addUnitHomeBtn) addUnitHomeBtn.addEventListener('click', ()=> document.getElementById('addUnitBtn').click());
  const addItemHomeBtn = document.getElementById('addItemHomeBtn');
  if(addItemHomeBtn) addItemHomeBtn.addEventListener('click', ()=> document.getElementById('addItemBtn').click());
  const addLogBtn = document.getElementById('addLogBtn');
  if(addLogBtn) addLogBtn.addEventListener('click', ()=>{
    if(!requireAdmin()) return;
    draftLogEntry = {id:null, date: todayStr(), title:'', content:'', image:'', isLimitedReturn:false, linkedUnits:[], linkedMemories:[], linkedFamilies:[]};
    addingLog = true;
    renderHome();
  });
  const cancelBtn = document.getElementById('cancelLogBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ addingLog=false; draftLogEntry=null; renderHome(); });
  const saveLogBtn = document.getElementById('saveLogBtn');
  if(saveLogBtn) saveLogBtn.addEventListener('click', async ()=>{
    if(!requireAdmin()) return;
    const date = draftLogEntry.date || todayStr();
    const title = draftLogEntry.title.trim() || '未命名更新';
    const content = draftLogEntry.content.trim();
    if(draftLogEntry.id){
      const existing = state.updateLog.find(l=>l.id===draftLogEntry.id);
      if(existing){
        existing.date = date;
        existing.title = title;
        existing.content = content;
        existing.image = draftLogEntry.image || '';
        existing.isLimitedReturn = !!draftLogEntry.isLimitedReturn;
        existing.linkedUnits = draftLogEntry.linkedUnits || [];
        existing.linkedMemories = draftLogEntry.linkedMemories || [];
        existing.linkedFamilies = draftLogEntry.linkedFamilies || [];
        existing.updatedAt = Date.now();
      }
    } else {
      state.updateLog.unshift({
        id:uid(), date, title, content, image: draftLogEntry.image||'', isLimitedReturn: !!draftLogEntry.isLimitedReturn,
        linkedUnits: draftLogEntry.linkedUnits||[], linkedMemories: draftLogEntry.linkedMemories||[], linkedFamilies: draftLogEntry.linkedFamilies||[],
        updatedAt:Date.now()
      });
    }
    addingLog = false;
    draftLogEntry = null;
    await saveData(false);
    renderHome();
  });
  container.querySelectorAll('[data-edit-log]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!requireAdmin()) return;
      const id = btn.dataset.editLog;
      const existing = state.updateLog.find(l=>l.id===id);
      if(!existing) return;
      draftLogEntry = {
        id: existing.id, date: existing.date, title: existing.title, content: existing.content, image: existing.image||'', isLimitedReturn: !!existing.isLimitedReturn,
        linkedUnits: [...(existing.linkedUnits||[])], linkedMemories: [...(existing.linkedMemories||[])], linkedFamilies: [...(existing.linkedFamilies||[])]
      };
      addingLog = true;
      renderHome();
    });
  });
  container.querySelectorAll('[data-del-log]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireAdmin()) return;
      const id = btn.dataset.delLog;
      if(!confirm('删除这条更新记录？')) return;
      state.updateLog = state.updateLog.filter(l=>l.id!==id);
      await saveData(false);
      renderHome();
    });
  });
  container.querySelectorAll('.mark-chip[data-view]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      if(!isPlainLeftClick(e)) return;
      e.preventDefault();
      goToView({type: chip.dataset.view, id: chip.dataset.id});
      editMode=false; draftUnit=null; draftSimple=null; showingShinyImage=false;
      render();
    });
  });
  wireBackButton(container);
}

  });

    el.addEventListener('change', async ()=>{
      const i = parseInt(el.dataset.emColorFormula);

      await saveData(true);
      renderEnemyMechanics();
    });
  });
  container.querySelectorAll('[data-em-image-bind]').forEach(el=>{
    el.addEventListener('change', ()=>{

      await saveData(true);

      setPath(state.enemyMechanicCategories, el.dataset.emCatBind, el.value);

  });
  container.querySelectorAll('[data-em-cat-color-formula]').forEach(el=>{
    el.addEventListener('change', async ()=>{

async function duplicateUnit(unitId){
  if(!requireAdmin()) return;
  const original = state.units.find(u=>u.id===unitId);
  if(!original) return;
  const copy = JSON.parse(JSON.stringify(original));
  copy.id = uid();
  copy.name = (original.name||'未命名单位') + '（副本）';
  copy.comments = [];
  copy.updatedAt = Date.now();
  state.units.unshift(copy);
  currentView = {type:'unit', id:copy.id};
  editMode = false; showingShinyImage = false;
  await saveData(true);
  showToast('已复制单位，可以在下面编辑副本');
  render();
}

function startUnitEdit(unit){
  draftUnit = JSON.parse(JSON.stringify(unit));
  if(!Array.isArray(draftUnit.skills)) draftUnit.skills = [];
  if(!Array.isArray(draftUnit.attacks)) draftUnit.attacks = [];
  draftUnit.attacks.forEach(a=>{
    if(!Array.isArray(a.media)) a.media = a.image ? [a.image] : [];
  });
  if(!Array.isArray(draftUnit.marks)) draftUnit.marks = [];
  if(!Array.isArray(draftUnit.skins)) draftUnit.skins = [];
  draftUnit.skins.forEach(s=>{
    if(!Array.isArray(s.media)) s.media = s.image ? [s.image] : [];
  });
  if(!Array.isArray(draftUnit.passives)){
    draftUnit.passives = unit.passive ? [{id:uid(), name:'被动1', description:unit.passive}] : [];
  }
  draftUnit.placementLimit = unit.placementLimit || '';
  draftUnit.obtainWay = unit.obtainWay || '';
  if(!Array.isArray(draftUnit.otherForms)) draftUnit.otherForms = [];
  if(!Array.isArray(draftUnit.linkedMemories)) draftUnit.linkedMemories = [];
  if(!Array.isArray(draftUnit.linkedFamilies)) draftUnit.linkedFamilies = [];
  if(!Array.isArray(draftUnit.relatedUnits)) draftUnit.relatedUnits = [];
  draftUnit.groups = Array.isArray(unit.groups) ? [...unit.groups] : (unit.group ? [unit.group] : []);
  draftUnit.elements = Array.isArray(unit.elements) ? [...unit.elements] : [];
  draftUnit.tagsRaw = (unit.tags||[]).join(', ');
  editMode = true;
}

function sumAttackCost(attack){
  return attack.levels.reduce((sum,lvl)=>{
    const n = parseFloat(String(lvl.cost||'').replace(/[^0-9.\-]/g,''));
    return sum + (isNaN(n) ? 0 : n);
  }, 0);
}

function applyTraitPct(baseVal, pct){
  const base = parseFloat(String(baseVal==null?'':baseVal).replace(/[^0-9.\-]/g,''));
  const p = parseFloat(pct);
  if(isNaN(base) || isNaN(p) || !p) return null;
  const result = base * (1 + p/100);
  return Math.round((result + Number.EPSILON) * 100) / 100;
}
